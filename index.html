<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>21 Days</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FF6B2C">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: phone-width app shell, sticky stat bar on top, fixed bottom tab bar, chunky 3D buttons. */
:root{
  --bg:#F2F4F8; --card:#FFFFFF; --card-2:#EDF0F6; --ink:#1A1F33; --muted:#5C6482; --line:#E1E5EE;
  /* --p0 is the raw theme color. --pb sits behind white text (>= 4.4:1 for every theme), --p is accent text and rings. */
  --p0:#FF6B2C; --pb:color-mix(in srgb,var(--p0) 68%,#000); --p:var(--pb); --p-dark:color-mix(in srgb,var(--p0) 48%,#000);
  --hk:72%;
  --sat:env(safe-area-inset-top,var(--safe-area-inset-top,0px)); --sab:env(safe-area-inset-bottom,var(--safe-area-inset-bottom,0px));
  --p-soft:color-mix(in srgb,var(--p) 14%,var(--card));
  --ok:#1FBF8A; --ok-dark:#12976B; --ok-soft:color-mix(in srgb,var(--ok) 15%,var(--card));
  --gold:#FFBF1F; --gold-dark:#D49500; --gold-soft:color-mix(in srgb,var(--gold) 20%,var(--card));
  --ice:#38B6F5; --ice-dark:#1A8FCB; --ice-soft:color-mix(in srgb,var(--ice) 15%,var(--card));
  --bad:#EF4462; --grape:#8B5CF6;
  --font:"Nunito", ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1120; --card:#181C2F; --card-2:#22273F; --ink:#EEF0F9; --muted:#9BA2C2; --line:#2A3050;
    --p:color-mix(in srgb,var(--p0) 60%,#fff); --hk:100%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{ --bg:#0E1120; --card:#181C2F; --card-2:#22273F; --ink:#EEF0F9; --muted:#9BA2C2; --line:#2A3050; --p:color-mix(in srgb,var(--p0) 60%,#fff); --hk:100%; color-scheme:dark; }
@media (prefers-contrast: more){ :root{ --line:#7B84A3; --muted:#3F4660 } }
@media (prefers-contrast: more) and (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --line:#6B7399; --muted:#C5CAE3 } }
@media (prefers-reduced-transparency: reduce){ .topbar{backdrop-filter:none;background:var(--bg)} }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
html,body{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,[data-action],.opt,.switch{touch-action:manipulation}
h1,h2,h3{margin:0;line-height:1.15;font-weight:900;text-wrap:balance}
:focus-visible{outline:3px solid var(--p);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.shell{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px 120px;position:relative}

/* Top stat bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:calc(12px + var(--sat)) 16px 10px;margin:0 -16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:6px 11px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-weight:900;font-size:1rem}
.chip svg{width:20px;height:20px}
.chip.flame{color:var(--p)}
.chip.flame.cold{color:var(--muted)}
.chip.flame.cold svg{opacity:.45;filter:grayscale(1)}
.chip.flame.hot svg{animation:flicker 1s ease-in-out infinite;transform-origin:50% 90%}
.chip.coins{color:var(--gold-dark)}
.chip.shields{color:var(--ice-dark)}
.chip.bump{animation:bump .55s cubic-bezier(.2,1.8,.4,1)}
.lvl-btn{margin-left:auto;position:relative;width:46px;height:46px;flex:none}
.lvl-btn svg{position:absolute;inset:0;width:46px;height:46px;transform:rotate(-90deg)}
.lvl-btn circle{fill:none;stroke-width:5}
.lvl-btn .t{stroke:var(--card-2)} .lvl-btn .v{stroke:var(--grape);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.9,.3,1)}
.lvl-btn b{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-weight:900;font-size:1rem;color:var(--grape)}
.lvl-btn.bump b{animation:bump .55s cubic-bezier(.2,1.8,.4,1)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:var(--card);border-top:2px solid var(--line);padding:6px 6px calc(6px + var(--sab))}
.nav-in{display:flex;width:100%;max-width:480px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;color:var(--muted);font-weight:800;font-size:0.6875rem}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--p);background:var(--p-soft)}
.nav button{transition:color .2s ease,background-color .2s ease}
@keyframes navPop{50%{transform:scale(1.25) translateY(-2px)}}
.fab{position:fixed;z-index:35;bottom:calc(84px + var(--sab));right:max(16px,calc(50% - 224px));width:60px;height:60px;border-radius:20px;background:var(--pb);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 var(--p-dark),0 10px 24px color-mix(in srgb,var(--p) 40%,transparent)}
.fab svg{width:30px;height:30px}
.fab:active{transform:translateY(4px);box-shadow:0 1px 0 var(--p-dark)}

/* Cards, buttons */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.sec-h h2{font-size:1.25rem}
.sec-h .muted{font-weight:700;font-size:0.875rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:16px;background:var(--pb);color:#fff;font-weight:900;font-size:1rem;box-shadow:0 4px 0 var(--p-dark);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--p-dark)}
.btn svg{width:20px;height:20px}
.btn.full{width:100%}
.btn.ok{background:var(--ok-dark);box-shadow:0 4px 0 color-mix(in srgb,var(--ok-dark) 65%,#000)}
.btn.gold{background:var(--gold);color:#3A2800;box-shadow:0 4px 0 var(--gold-dark)}
.btn.ice{background:var(--ice);color:#0B2540;box-shadow:0 4px 0 var(--ice-dark)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.danger{background:var(--card);color:var(--bad);border:2px solid color-mix(in srgb,var(--bad) 35%,var(--line));box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 25%,var(--line))}
.btn.sm{min-height:44px;padding:8px 14px;font-size:0.875rem;border-radius:12px;box-shadow:0 3px 0 var(--p-dark)}
.btn.sm.ghost{box-shadow:0 3px 0 var(--line)}
.btn.sm.ok{box-shadow:0 3px 0 color-mix(in srgb,var(--ok-dark) 65%,#000)}
.btn.sm.gold{box-shadow:0 3px 0 var(--gold-dark)}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{display:inline-flex;align-items:center;min-height:44px;color:var(--p);font-weight:800}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:0.75rem;font-weight:900;background:var(--card-2);color:var(--muted)}

/* Pet hero */
.hero{display:flex;align-items:center;gap:8px;padding:12px 14px;margin-top:6px;background:linear-gradient(160deg,var(--p-soft),var(--card) 70%);border:2px solid var(--line);border-radius:26px;position:relative;overflow:hidden}
.hero .petbox{flex:none;width:128px;height:128px;cursor:pointer}
.hero-r{flex:1;min-width:0}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;font-weight:800;font-size:0.9375rem}
.bubble::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble.say{animation:say .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes say{from{transform:scale(.85);opacity:.3}}
.energy{margin-top:10px}
.energy-top{display:flex;justify-content:space-between;font-size:0.8125rem;font-weight:800;color:var(--muted)}
.ebar{height:14px;border-radius:99px;background:var(--card-2);overflow:hidden;margin-top:4px;border:2px solid var(--line)}
.ebar i{position:relative;display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),#7BE495);transition:width .8s cubic-bezier(.2,1.2,.3,1);overflow:hidden}
.ebar i::after,.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 2.8s ease-in-out infinite}
@keyframes shimmer{60%,100%{transform:translateX(100%)}}

/* Pet SVG animation */
.pet{width:100%;height:100%;overflow:visible}
.pet .body-g{transform-origin:100px 185px;animation:idle 2.8s ease-in-out infinite}
.pet.happy .body-g{animation:hop 1.1s ease-in-out infinite}
.pet.sleepy .body-g{animation:idle 4.5s ease-in-out infinite}
.pet .eyes{transform-origin:100px 108px;animation:blink 4.2s infinite}
.pet .arm-l{transform-origin:46px 128px;animation:wave 2.8s ease-in-out infinite}
.pet .arm-r{transform-origin:154px 128px;animation:wave2 2.8s ease-in-out infinite}
.pet.happy .arm-l{animation:waveBig .55s ease-in-out infinite}
.pet.happy .arm-r{animation:waveBig2 .55s ease-in-out infinite}
.pet .sprout{transform-origin:100px 62px;animation:sproutSway 3s ease-in-out infinite}
.pet .zzz{animation:zzz 2.5s ease-in-out infinite}
.pet .spark{animation:spark 1.6s ease-in-out infinite}
.pet.jump .body-g{animation:jump .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes idle{50%{transform:scale(1.03,.97)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-10px) scale(.97,1.04)}55%{transform:translateY(0) scale(1.05,.95)}}
@keyframes jump{0%{transform:scale(1.1,.85)}40%{transform:translateY(-34px) scale(.92,1.1)}75%{transform:translateY(0) scale(1.08,.92)}100%{transform:scale(1)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wave{50%{transform:rotate(-8deg)}}
@keyframes wave2{50%{transform:rotate(8deg)}}
@keyframes waveBig{50%{transform:rotate(-40deg)}}
@keyframes waveBig2{50%{transform:rotate(40deg)}}
@keyframes sproutSway{50%{transform:rotate(7deg)}}
@keyframes zzz{0%{opacity:0;transform:translate(0,0)}50%{opacity:1}100%{opacity:0;transform:translate(10px,-16px)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.wday{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:0.75rem;font-weight:800;color:var(--muted)}
.wday.today{color:var(--p)}
.wday svg{width:36px;height:36px;transform:rotate(-90deg)}
.wday circle{fill:none;stroke-width:4}
.wday .t{stroke:var(--card-2)}
.wday .v{stroke:var(--ok);stroke-linecap:round}
.wday .full{fill:var(--ok)}
.wday .ice{fill:var(--ice)}
.wbox{position:relative;width:36px;height:36px}
.wbox span{position:absolute;inset:0;display:grid;place-items:center;font-size:min(0.75rem,15px);font-weight:900;color:var(--ink)}
.wbox span svg{width:16px;height:16px;transform:none;color:#fff}

/* Pledge, quests */
.pledge{display:flex;align-items:center;gap:14px}
.pledge .btn{flex:none}
.pledge .pi{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-dark)}
.pledge .pi svg{width:30px;height:30px}
.pledge h3{font-size:1.0625rem}
.pledge p{margin:2px 0 0;font-size:0.875rem;color:var(--muted);font-weight:600}
.hold{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hold::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.4);transform:scaleX(0);transform-origin:left;transition:transform .15s}
.hold.holding::before{transform:scaleX(1);transition:transform 1.1s linear}
.hold span{position:relative}
.quest{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.quest:last-of-type{border-bottom:0}
.qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--p-soft);color:var(--p)}
.qi svg{width:22px;height:22px}
.quest b{display:block;font-size:0.9375rem}
.qbar{height:12px;border-radius:99px;background:var(--card-2);overflow:hidden;margin-top:5px}
.qbar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .6s cubic-bezier(.2,1.2,.3,1)}
.quest.claimed .qi{background:var(--ok-soft);color:var(--ok)}
.quest.claimed b{color:var(--muted);text-decoration:line-through}
.qr{font-size:0.8125rem;font-weight:900;color:var(--gold-dark);display:flex;align-items:center;gap:3px;white-space:nowrap}
.qr svg{width:16px;height:16px}
.chest-btn{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:12px 14px;border-radius:18px;text-align:left;background:linear-gradient(135deg,var(--gold-soft),var(--p-soft));border:2px solid var(--gold);animation:chestGlow 1.8s ease-in-out infinite}
.chest-btn h3{font-size:1.0625rem}
.chest-btn p{margin:2px 0 0;font-size:0.8125rem;color:var(--muted);font-weight:700}
.chest{width:64px;height:58px;flex:none;animation:bob 1.6s ease-in-out infinite}
.chest-btn.shake .chest{animation:shake .45s ease-in-out 3}
.chest-btn.locked{animation:none;border-color:var(--line);background:var(--card-2)}
.chest-btn.locked .chest{animation:none;filter:grayscale(1);opacity:.5}
@keyframes chestGlow{50%{box-shadow:0 0 26px color-mix(in srgb,var(--gold) 55%,transparent)}}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
@keyframes shake{25%{transform:rotate(-14deg) scale(1.08)}75%{transform:rotate(14deg) scale(1.08)}}

/* Habit cards */
.group-h{margin:20px 4px 8px;font-size:0.8125rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.group-h svg{width:16px;height:16px}
.hlist{display:grid;gap:10px}
.hcard{position:relative;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .1s}
.hcard:active{transform:scale(.99)}
.hcard.done{background:color-mix(in srgb,var(--hc) 9%,var(--card));border-color:color-mix(in srgb,var(--hc) 45%,var(--line))}
.hicon{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--hc) 16%,var(--card));color:color-mix(in srgb,var(--hc) var(--hk),#000)}
.hicon svg{width:28px;height:28px}
.hbody{flex:1;min-width:0}
.hname{font-weight:900;font-size:1.0625rem;line-height:1.2;overflow-wrap:anywhere}
.hcard.done .hname{color:color-mix(in srgb,var(--ink) 70%,var(--muted))}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:3px;font-size:0.8125rem;font-weight:800;color:var(--muted)}
.hmeta .fl{display:inline-flex;align-items:center;gap:2px;color:var(--p)}
.hmeta .fl svg{width:14px;height:14px}
.hmeta .fl.zero{color:var(--muted)}
.hmeta .saved{color:var(--ok)}
.hwarn{margin-top:5px;font-size:0.75rem;font-weight:800;color:var(--p)}
.sos{flex:none;min-height:44px;padding:8px 10px;border-radius:12px;background:var(--ice-soft);color:var(--ice-dark);font-weight:900;font-size:0.8125rem;border:2px solid color-mix(in srgb,var(--ice) 40%,var(--line))}
.hcheck{flex:none;position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);color:var(--muted)}
.hcheck svg.ring{position:absolute;inset:0;width:58px;height:58px;transform:rotate(-90deg)}
.hcheck circle{fill:none;stroke-width:5}
.hcheck .t{stroke:var(--line)}
.hcheck .v{stroke:color-mix(in srgb,var(--hc) var(--hk),#000);stroke-linecap:round;transition:stroke-dashoffset .45s cubic-bezier(.2,1.2,.3,1)}
.hcheck .ck{width:28px;height:28px;position:relative}
.hcheck .cnt{position:relative;font-weight:900;font-size:0.875rem;color:var(--ink)}
.hcheck.done{background:color-mix(in srgb,var(--hc) 74%,#000);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--hc) 65%,#000)}
.hcheck.done .t,.hcheck.done .v{stroke:transparent}
.hcheck:active{transform:scale(.92)}
.hcheck.pop{animation:pop .4s cubic-bezier(.34,1.4,.64,1)}
.hcheck.pop .ck path{animation:draw .45s .05s ease-out both}
.hcheck .ck path{stroke-dasharray:24}
.hcheck.pop::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:4px solid var(--hc);animation:ripple .65s ease-out forwards;pointer-events:none}
.hcheck.tick{animation:tick .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes tick{50%{transform:scale(1.12)}}
@keyframes draw{from{stroke-dashoffset:24}}
@keyframes ripple{to{inset:-22px;opacity:0}}
.hcard.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-100%);animation:sweep .9s ease-out forwards;pointer-events:none}
@keyframes sweep{to{transform:translateX(100%)}}
.off-list .hcard{opacity:.6}
.empty{text-align:center;padding:28px 18px}
.empty h2{font-size:1.375rem}
.empty p{color:var(--muted);font-weight:600;max-width:36ch;margin:8px auto 16px}

/* Generic animation */
.anim .enter{animation:enter .4s cubic-bezier(.22,1,.36,1) both;animation-delay:min(calc(var(--i,0) * 35ms),280ms)}
@keyframes enter{from{transform:translateY(10px);opacity:0}}
@keyframes bump{40%{transform:scale(1.3) rotate(-6deg)}100%{transform:scale(1)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.2) rotate(5deg)}}

/* Stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.tile .tv{display:flex;align-items:center;gap:6px;font-size:1.75rem;font-weight:900;line-height:1.1}
.tile .tv svg{width:26px;height:26px}
.tile span{font-size:0.8125rem;font-weight:700;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dh{font-size:0.75rem;font-weight:900;color:var(--muted)}
.cal .d{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:0.8125rem;font-weight:800;color:var(--muted)}
.cal .d.on{background:var(--pb);color:#fff}
.cal .d.ice{background:var(--ice);color:#fff}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--p);color:var(--p)}
.cal .d.on.today{color:#fff;box-shadow:0 0 0 3px var(--p-soft)}
.cal .d.fut{opacity:.35}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--card-2)}
.heat i.l1{background:color-mix(in srgb,var(--ok) 35%,var(--card-2))}
.heat i.l2{background:color-mix(in srgb,var(--ok) 65%,var(--card-2))}
.heat i.l3{background:var(--ok)}
.heat i.na{opacity:.3}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;border-bottom:2px solid var(--line)}
.bars .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars .col i{display:block;width:100%;max-width:34px;border-radius:9px 9px 3px 3px;background:var(--p);min-height:4px}
.bars .col.best i{background:var(--gold)}
.bars .col small{font-size:0.6875rem;font-weight:800;color:var(--muted)}
.blabels{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:0.75rem;font-weight:900;color:var(--muted);margin-top:6px}
.hstat{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.hstat:last-child{border-bottom:0}
.hstat .hicon{width:40px;height:40px;border-radius:12px}
.hstat .hicon svg{width:22px;height:22px}
.rbar{height:10px;border-radius:99px;background:var(--card-2);overflow:hidden;margin-top:4px}
.rbar i{display:block;height:100%;background:var(--hc);border-radius:99px}
.hb{display:grid;grid-template-columns:110px 1fr 28px;align-items:center;gap:10px;font-size:0.875rem;font-weight:700;margin-top:8px}
.hb .rbar{margin:0}
.hb .rbar i{background:var(--p)}
.mood-chart svg{width:100%;height:120px}
.seg{display:flex;gap:6px;background:var(--card-2);padding:4px;border-radius:14px}
.seg button{flex:1;min-height:44px;padding:8px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.logrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px solid var(--line);font-size:0.875rem}
.logrow:last-child{border-bottom:0}
.logrow .lb{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900}
.lb.res{background:var(--ok-soft);color:var(--ok-dark)}
.lb.gave{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}

/* Pet tab, shop */
.pet-stage{position:relative;text-align:center;padding:18px 14px 16px;border-radius:28px;background:radial-gradient(circle at 50% 70%,var(--p-soft),var(--card) 70%);border:2px solid var(--line)}
.pet-stage .petbox{width:200px;height:200px;margin:0 auto;cursor:pointer}
.pet-stage h2{font-size:1.625rem}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 12px;border-radius:18px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;text-align:center}
.item .iv{width:64px;height:64px;display:grid;place-items:center}
.item .iv svg{width:64px;height:64px}
.item b{font-size:0.8125rem;line-height:1.2}
.item .price{display:inline-flex;align-items:center;gap:3px;font-size:0.8125rem;font-weight:900;color:var(--gold-dark)}
.item .price svg{width:15px;height:15px}
.item.owned .price{color:var(--ok-dark)}
.item.on{border-color:var(--ok);background:var(--ok-soft)}
.item.cant{opacity:.55}
.swatches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.reward-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--line)}
.reward-row:last-child{border-bottom:0}
.reward-row b{flex:1}

/* Friends & profile */
.lb-row{display:grid;grid-template-columns:28px 42px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.lb-row.me{border-color:var(--p);background:var(--p-soft)}
.rank{font-weight:900;font-size:1.125rem;text-align:center;color:var(--muted)}
.rank.r1{color:var(--gold-dark)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#1A1F33;background:var(--av)}
.lb-name{min-width:0}
.lb-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-name span{font-size:0.75rem;font-weight:700;color:var(--muted)}
.lb-right{display:flex;align-items:center;gap:8px}
.lb-xp{text-align:right;font-weight:900}
.lb-xp small{display:block;font-size:0.6875rem;color:var(--muted);font-weight:700}
.profile-head{display:flex;align-items:center;gap:14px}
.profile-head .petbox{width:90px;height:90px;flex:none}
.xpbar{height:16px;border-radius:99px;background:var(--card-2);overflow:hidden;border:2px solid var(--line);margin-top:6px}
.xpbar i{position:relative;display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--grape),#C084FC);overflow:hidden}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bcard{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:12px 6px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.bcard b{font-size:0.75rem;line-height:1.2}
.bcard small{font-size:0.6875rem;color:var(--muted);font-weight:700;line-height:1.25}
.bcard.locked .bdg{filter:grayscale(1);opacity:.3}
.bcard.locked b{color:var(--muted)}
.bdg{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--rc) 65%,#fff),var(--rc));box-shadow:0 4px 0 color-mix(in srgb,var(--rc) 60%,#000),inset 0 2px 0 rgba(255,255,255,.4);transform:rotate(-5deg)}
.bdg svg{width:28px;height:28px}
.rarity{font-size:0.6875rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--rc) 65%,var(--ink))}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;color:var(--muted);font-weight:600}
.switch{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch::before{content:"";position:absolute;inset:-6px -2px}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{left:24px}

/* Sheets & modals */
.back{position:fixed;inset:0;z-index:50;background:rgba(9,12,28,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.back.center{align-items:center;padding:16px}
.sheet{width:100%;max-width:480px;max-height:94%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px 28px;animation:up .38s cubic-bezier(.32,.72,0,1)}
.sheet.full{height:100%;max-height:100%;border-radius:0}
.sheet-grip{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h2{font-size:1.375rem}
.x{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:2px solid var(--line)}
.x svg{width:20px;height:20px}
.modal{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:22px;text-align:center;animation:rise .32s cubic-bezier(.32,.72,0,1)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes rise{from{transform:translateY(20px) scale(.95);opacity:0}}
.field{display:grid;gap:6px;margin-top:14px}
.field > label,.field > .lbl{font-weight:900;font-size:0.875rem}
.field small{color:var(--muted);font-weight:600}
input[type=text],input[type=number],textarea,select{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--p)}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:9px 13px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-weight:800;font-size:0.875rem}
.opt[aria-pressed="true"]{border-color:var(--p);background:var(--p-soft);color:var(--p)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--card);font-weight:900;font-size:0.8125rem}
.daypick button[aria-pressed="true"]{background:var(--pb);border-color:var(--pb);color:#fff}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.iconpick button{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted)}
.iconpick button svg{width:24px;height:24px}
.iconpick button[aria-pressed="true"]{border-color:var(--hc);color:var(--hc);background:color-mix(in srgb,var(--hc) 14%,var(--card))}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);text-align:left;font-weight:800;font-size:0.875rem;line-height:1.2}
.tpl .hicon{width:40px;height:40px;border-radius:12px}
.tpl .hicon svg{width:22px;height:22px}
.err{color:var(--bad);font-weight:800;font-size:0.875rem;min-height:1em;margin-top:8px}
.big-counter{font-size:2.5rem;font-weight:900;line-height:1}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mini-cal i{aspect-ratio:1;border-radius:6px;background:var(--card-2)}
.mini-cal i.on{background:var(--hc)}
.mini-cal i.na{opacity:.25}
.mini-cal i.today{box-shadow:inset 0 0 0 2px var(--ink)}
.ms-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.ms{flex:none;width:64px;padding:8px 4px;border-radius:14px;text-align:center;background:var(--card-2);font-size:0.75rem;font-weight:800;color:var(--muted)}
.ms b{display:block;font-size:1.125rem;color:var(--ink)}
.ms.hit{background:var(--ok-soft);color:var(--ok-dark)}
.reason{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:800;margin-top:8px}
.reason svg{width:20px;height:20px;color:var(--bad);flex:none}
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;aspect-ratio:1;max-width:62px;border-radius:18px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);display:grid;place-items:center}
.mood svg{width:38px;height:38px}
.mood[aria-pressed="true"]{border-color:var(--p);background:var(--p-soft);transform:scale(1.06)}
.breath-wrap{display:grid;place-items:center;height:240px;position:relative}
.breath{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ice) 70%,#fff),var(--ice));box-shadow:0 0 50px color-mix(in srgb,var(--ice) 50%,transparent);animation:breathe 12s ease-in-out infinite;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.375rem}
@keyframes breathe{0%{transform:scale(.5)}33%{transform:scale(1)}66%{transform:scale(1)}100%{transform:scale(.5)}}
.breath span{animation:none}

/* Onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;padding:20px 4px 10px;text-align:center}
.ob h1{font-size:1.875rem;margin-top:10px}
.ob p{color:var(--muted);font-weight:700;margin:8px auto 0;max-width:34ch}
.ob .grow{flex:1;display:flex;flex-direction:column;justify-content:center}
.ob .foot{display:grid;gap:10px;margin-top:20px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:width .2s}
.dots i.on{width:24px;background:var(--p)}
.egg{width:180px;height:210px;margin:0 auto;cursor:pointer;animation:wobble 2.2s ease-in-out infinite;transform-origin:50% 90%}
.egg.crack{animation:crack .12s linear infinite}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-8deg)}84%{transform:rotate(8deg)}92%{transform:rotate(-4deg)}}
@keyframes crack{50%{transform:rotate(6deg) scale(1.03)}0%,100%{transform:rotate(-6deg)}}
.ob-pet{width:200px;height:200px;margin:0 auto;animation:hatch .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes hatch{from{transform:scale(.2) translateY(40px);opacity:0}}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.goal{padding:14px 12px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-weight:900;font-size:0.9375rem;display:flex;gap:10px;align-items:center}
.goal svg{width:26px;height:26px;flex:none;color:var(--p)}
.goal[aria-pressed="true"]{border-color:var(--p);background:var(--p-soft)}
.how{display:grid;gap:10px;text-align:left}
.how div{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.how svg{width:30px;height:30px;flex:none}

/* Wheel of fortune: pointer stays still, only the disc turns. Labels carry the meaning, color is decoration. */
.wheel-wrap{position:relative;width:min(300px,100%);aspect-ratio:1;margin:18px auto 8px}
.wheel{width:100%;height:100%;transition:transform 4.4s cubic-bezier(.12,.7,.1,1)}
.wheel svg{display:block;width:100%;height:100%}
.wheel-ptr{position:absolute;left:50%;top:-10px;width:26px;height:30px;margin-left:-13px;color:var(--ink)}
.wheel-prize{min-height:34px;margin:6px 0 10px;font-size:1.5rem;font-weight:900}
.chest-btn:disabled{cursor:default}

/* Care: needs, food tray, rooms, minigames */
.scene{position:relative;border-radius:22px;overflow:hidden;padding-top:8px}
.sc-meadow{background:linear-gradient(#BDE8FF 0 64%,#7FD66A 64%)}
.sc-sky{background:linear-gradient(#5AA9FF,#CDEBFF)}
.sc-night{background:radial-gradient(circle,#fff 1px,transparent 1.6px) 0 0/34px 34px,linear-gradient(#141B4D,#3B2F7A)}
.sc-candy{background:repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 14px,transparent 14px 28px),linear-gradient(135deg,#FFD1E8,#FFF1B8)}
.bgprev{display:block;width:64px;height:64px;border-radius:16px}
.stats{display:grid;gap:10px}
.stat{display:grid;grid-template-columns:64px 1fr 32px;align-items:center;gap:10px;font-size:.875rem;font-weight:800}
.stat b{text-align:right}
.sbar{height:14px;border-radius:99px;background:var(--card-2);border:2px solid var(--line);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .6s cubic-bezier(.2,1.2,.3,1)}
.sbar i.low{background:var(--bad)}
.foodline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-weight:800;font-size:.875rem}
.care-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tray .item{padding:8px 2px 10px}
.tray .item .iv,.tray .item .iv svg{width:44px;height:44px}
.tray-hint{margin:10px 0 0;font-size:.8125rem;font-weight:600}
.flyfood{position:fixed;z-index:75;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none}
.suds{position:fixed;z-index:75;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 30%,#fff,rgba(160,220,255,.6));border:2px solid rgba(255,255,255,.85)}
.pet.eat .body-g{animation:chomp .45s ease-in-out 2}
@keyframes chomp{50%{transform:scale(1.1,.88)}}
.pet.flip .body-g{transform-origin:100px 120px;animation:flip .8s ease-in-out}
@keyframes flip{50%{transform:translateY(-46px) rotate(180deg)}100%{transform:rotate(360deg)}}
.game-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.game-h b{font-size:1.75rem}
.game-h .grow{margin-left:auto;font-size:1.75rem;font-weight:900}
.stage{position:relative;height:calc(100% - 64px);min-height:320px;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(#BDE8FF,#E8F7FF 70%,#7FD66A 70%)}
.stage.jolt{animation:jolt .3s}
@keyframes jolt{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.g-pet{position:absolute;left:0;bottom:0;width:76px;height:76px}
.g-item{position:absolute;left:0;top:0;width:40px;height:40px;pointer-events:none}
.g-item svg{display:block;width:100%;height:100%}
.bub{position:absolute;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 30% 30%,#fff,rgba(120,200,255,.55) 60%,rgba(70,160,255,.8));border:3px solid rgba(255,255,255,.9)}
.bub.gold{background:radial-gradient(circle at 30% 30%,#FFF6C2,#FFC21F)}
.nav button.dot{position:relative}
.nav button.dot::after{content:"";position:absolute;top:6px;left:calc(50% + 10px);width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.tpl[disabled]{opacity:.5}
.seg.scroll{overflow-x:auto}
.seg.scroll button{flex:1 0 auto;padding:8px 14px;white-space:nowrap}

/* Group */
.qr{width:min(240px,70vw);margin:8px auto 0;padding:10px;background:#fff;border-radius:16px;line-height:0}
.qr svg{display:block;width:100%;height:auto}
.codebox{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:1.5rem;font-weight:900;letter-spacing:.12em}
.priv{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.priv>span{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--ok-soft);color:var(--ok-dark)}
.priv.no>span{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.priv>span svg{width:18px;height:18px}

/* Journal */
.jrow{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:2px solid var(--line)}
.jrow:last-child{border-bottom:0}
.jmeta{display:flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:800}
.jmood svg{display:block;width:18px;height:18px}
.jtext{margin-top:4px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Smooth state changes and exits */
.btn,.opt,.seg button,.daypick button,.iconpick button,.sw,.mood,.item,.tpl,.goal,.ck,.x,.chip{transition:background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .12s ease,opacity .18s ease}
.opt:active,.seg button:active,.daypick button:active,.iconpick button:active,.sw:active,.mood:active,.item:active,.tpl:active,.goal:active,.ck:active,.x:active{transform:scale(.96)}
.switch,.switch::after{transition:background-color .2s ease,left .2s cubic-bezier(.32,.72,0,1)}
.back.closing{animation:fadeOut .2s ease forwards;pointer-events:none}
.back.closing .sheet{animation:down .22s cubic-bezier(.4,0,1,1) forwards}
.back.closing .modal{animation:fall .18s ease-in forwards}
.overlay.out{opacity:0;transition:opacity .2s ease;pointer-events:none}
@keyframes fadeOut{to{opacity:0}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fall{to{transform:translateY(12px) scale(.97);opacity:0}}

/* Tasks, tags, boss */
.struck{text-decoration:line-through}
.overdue{color:var(--bad)}
.tagbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:10px}
.tagbar .opt{flex:none;white-space:nowrap}
.ck-row{display:flex;align-items:center;gap:10px;padding:2px 0}
.ck-row span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.ck{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:#fff}
.ck.on{background:var(--ok-dark);border-color:var(--ok-dark)}
.ck svg{width:22px;height:22px}
.boss{display:flex;align-items:center;gap:14px;border-color:color-mix(in srgb,var(--bc) 45%,var(--line))}

// Local only: every saved change is written to IndexedDB with this device's id. Nothing leaves the device unless the person exports it.
const LOG_MAX = 5000;
const deviceId = (() => { try { let d = localStorage.getItem("21days-device"); if (!d) { d = uid() + uid(); localStorage.setItem("21days-device", d); } return d; } catch (e) { return "unbekannt"; } })();

let snap = null, curAct = null;
const takeSnap = () => { const o = {}; Object.keys(state).forEach(k => { o[k] = JSON.stringify(state[k]); }); return o; };
// Compares the state with the last saved one, so every mutation is logged without touching each call site.
function logChange() {
  const now = takeSnap();
  if (snap) {
    const changed = Object.keys(now).filter(k => now[k] !== snap[k]);
    if (changed.length) {
      // shortcut: the action is attributed by recency (3 s), a later timer is logged as "system"
      const fresh = curAct && Date.now() - curAct.t < 3000;
      const e = { ts: Date.now(), device: deviceId, action: fresh ? curAct.a : "system", target: fresh ? curAct.id || null : null, changed };
      ["xp", "coins", "freezes"].forEach(k => { if (changed.includes(k)) (e.delta = e.delta || {})[k] = state[k] - JSON.parse(snap[k]); });
      if (changed.includes("habits")) {
        const was = new Map(JSON.parse(snap.habits).map(h => [h.id, JSON.stringify(h)]));
        e.habits = state.habits.filter(h => was.get(h.id) !== JSON.stringify(h)).map(h => ({ id: h.id, name: h.name, doneToday: cnt(h, todayK()) }));

}

function openSheet(html, opts = {}) {

    const sc = opts.reset ? 0 : cur.scrollTop; cur.innerHTML = inner; cur.scrollTop = sc; cur.parentNode.dataset.back = opts.locked ? "" : "1";
  } else {
    sfx("open");
    $("#modalRoot").innerHTML = `<div class="back" data-back="${opts.locked ? "" : "1"}"><div class="sheet ${opts.full ? "full" : ""}" role="dialog" aria-modal="true">${inner}</div></div>`;
  }
  const f = $("#modalRoot [autofocus]"); if (f) f.focus();
}

  const lucky = hash01(h.id + t) < .12; if (lucky) xp *= 2;

}

  if (disc) disc.style.transform = `rotate(${360 * 5 - i * 45 + (Math.random() - .5) * 30}deg)`;
  if (!reduced) for (let k = 0; k < 14; k++) setTimeout(() => sfx("tick", 3), 4300 * Math.pow(k / 14, 1.8));
  setTimeout(() => {
    wheelBusy = false;
    const out = $("#wheelPrize");
    if (!out) { render(); return; }
    out.textContent = `Gewonnen: ${text}`;
    const r = disc.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    burst(x, y, hot ? 150 : 90, 1.3); if (hot) bigCelebration();
    if (s.k === "coins") flyCoins(x, y, Math.min(12, 3 + Math.round(s.v / 10))); else renderTopbar();
    sfx(hot ? "chest" : "bonus"); vibrate([40, 50, 80]);
    $("#wheelFoot").innerHTML = spins() ? `<button class="btn full" data-action="wheel">Nochmal drehen · ${spins()} übrig</button>` : `<button class="btn gold full" data-action="wheel-done">Einsammeln</button>`;
    const nb = $("#wheelFoot button"); if (nb) nb.focus();
  }, reduced ? 0 : 4500);
}

/* ============ Hold-to-confirm ============ */
let holdTimer = 0, holdEl = null;
document.addEventListener("pointerdown", e => {
  const b = e.target.closest("[data-hold]"); if (!b) return;
  holdEl = b; b.classList.add("holding"); vibrate(10);
  holdTimer = setTimeout(() => { b.classList.remove("holding"); holdEl = null; if (b.dataset.hold === "pledge") doPledge(b); }, 1100);
});
const cancelHold = () => { if (holdEl) { clearTimeout(holdTimer); holdEl.classList.remove("holding"); holdEl = null; } };
document.addEventListener("pointerup", cancelHold); document.addEventListener("pointercancel", cancelHold);
document.addEventListener("pointerout", e => { if (holdEl && e.target === holdEl && !holdEl.contains(e.relatedTarget)) cancelHold(); });

/* ============ Click delegation ============ */
document.addEventListener("click", e => {
  if (e.target.classList && e.target.classList.contains("back") && e.target.dataset.back === "1") { closeSheet(); return; }
  const holdB = e.target.closest("[data-hold]");
  if (holdB && e.detail === 0) { doPledge(holdB); return; }
  const b = e.target.closest("[data-action]"); if (!b) return;
  const a = b.dataset.action, id = b.dataset.id;
  curAct = { a, id, t: Date.now() };
  if (!SELF_SOUND.has(a)) sfx("tap"); if (!SELF_HAPTIC.has(a)) vibrate(8);
  if (b.closest(".hcard") && a === "detail" && e.target.closest("button")) return;
  switch (a) {
    case "go": sfx("tap"); if (location.hash.slice(1) === b.dataset.view) { animateNext = true; render(); } else location.hash = b.dataset.view; break;
    case "tap": e.stopPropagation(); tapHabit(id, b); if ($(".sheet") && b.closest(".sheet")) openDetail(id); break;
    case "minus": { const h = state.habits.find(x => x.id === id), t = todayK(); if (h && cnt(h, t) > 0) { const wasDone = isDone(h, t); h.log[t]--; if (!h.log[t]) delete h.log[t]; if (wasDone && !isDone(h, t)) { const x = h.xp[t] || 0; delete h.xp[t]; addXP(-x, t); addCoins(-Math.round(x / 2)); } sfx("undo"); save(); render(); openDetail(id); } break; }
    case "detail": openDetail(id); break;
    case "new": openTemplates(); break;
    case "tpl-kind": openTemplates.setKind(b.dataset.v); break;
    case "tpl": openEditor(draftFrom(null, TEMPLATES[b.dataset.kind][Number(b.dataset.i)], b.dataset.kind)); break;
    case "tpl-custom": openEditor(draftFrom(null, null, b.dataset.kind)); break;
    case "edit": { const h = state.habits.find(x => x.id === id); if (h) openEditor(draftFrom(h)); break; }
    case "f-icon": syncDraft(); draft.icon = b.dataset.v; rerenderEditor(); break;
    case "f-color": syncDraft(); draft.color = b.dataset.v; rerenderEditor(); break;
    case "f-day": { syncDraft(); const d = Number(b.dataset.v); draft.days = draft.days.includes(d) ? draft.days.filter(x => x !== d) : draft.days.concat(d).sort(); rerenderEditor(); break; }
    case "f-time": syncDraft(); draft.time = b.dataset.v; rerenderEditor(); break;
    case "save-habit": if (saveHabit()) { closeSheet(); if (!state.profile.onboarded) { ob.step = 4; drawOb(); } else render(); } break;
    case "del-habit":
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Wirklich löschen?"; break; }
      state.habits = state.habits.filter(h => h.id !== id); save(); closeSheet(); render(); toast("Gewohnheit gelöscht"); break;
    case "close": closeSheet(); if (!state.profile.onboarded && store.mode !== "loading") drawOb(); break;
    case "close-reward": closeSheet(); if (pendingLevel) setTimeout(showLevelUp, 200); break;
    case "claim": claimQuest(id, b); break;
    case "chest": openChest(b); break;
    case "j-new": jdraft = { id: null, habitId: id || "", mood: 0, text: "", back: $("#modalRoot .sheet") ? id || "" : "" }; openJournalSheet(); break;
    case "j-open": { const e = state.journal.find(q => q.id === id); if (e) { jdraft = Object.assign({}, e, { habitId: e.habitId || "", back: $("#modalRoot .sheet") ? e.habitId || "" : "" }); openJournalSheet(); } break; }
    case "j-all": progTab = "journal"; jFilter = id; closeSheet(); if (location.hash.slice(1) === "fortschritt") { animateNext = true; render(); } else location.hash = "fortschritt"; break;
    case "j-filter": jFilter = b.dataset.v; softRender("#prog"); break;
    case "j-habit": syncJ(); jdraft.habitId = b.dataset.v; rerenderJ(); break;
    case "j-mood": syncJ(); jdraft.mood = jdraft.mood === Number(b.dataset.v) ? 0 : Number(b.dataset.v); rerenderJ(); break;
    case "j-prompt": { syncJ(); const p = PROMPTS[Number(b.dataset.v)]; jdraft.text += (jdraft.text && !jdraft.text.endsWith("\n") ? "\n" : "") + p + "\n"; rerenderJ(); const ta = $("#jText"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } break; }
    case "j-save": if (saveJournal()) afterJournal(); break;
    case "j-del":
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Wirklich löschen?"; break; }
      state.journal = state.journal.filter(q => q.id !== id); save(); toast("Eintrag gelöscht"); afterJournal(); break;
    case "tag-filter": tagFilter = b.dataset.v; softRender("#tl"); break;
    case "f-diff": syncDraft(); draft.diff = Number(b.dataset.v); rerenderEditor(); break;
    case "f-tag": syncDraft(); draft.tag = b.dataset.v; rerenderEditor(); break;
    case "tag-add": addTag(b.dataset.for); break;
    case "tag-del": delTag(b.dataset.v); break;
    case "todo-new": tdraft = newTodo(); openSheet(todoHTML(tdraft)); break;
    case "todo-open": { const x = state.todos.find(q => q.id === id); if (x) { tdraft = JSON.parse(JSON.stringify(x)); openSheet(todoHTML(tdraft)); } break; }
    case "todo-tap": e.stopPropagation(); tapTodo(id, b); break;
    case "t-diff": syncTodo(); tdraft.diff = Number(b.dataset.v); rerenderTodo(); break;
    case "t-tag": syncTodo(); tdraft.tag = b.dataset.v; rerenderTodo(); break;
    case "ck-add": ckAdd(); break;
    case "ck-toggle": { syncTodo(); const c = tdraft.checklist.find(q => q.id === id); if (c) { c.done = !c.done; sfx(c.done ? "tick" : "undo", 3); } if (tdraft.id && saveTodo(true)) render(); rerenderTodo(); break; }
    case "ck-del": syncTodo(); tdraft.checklist = tdraft.checklist.filter(q => q.id !== id); rerenderTodo(); break;
    case "todo-save": if (saveTodo()) { closeSheet(); render(); } break;
    case "todo-del":
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Wirklich löschen?"; break; }
      state.todos = state.todos.filter(q => q.id !== id); save(); closeSheet(); render(); toast("Aufgabe gelöscht"); break;
    case "care-feed": careTab = careTab === "feed" ? null : "feed"; renderCare(); break;
    case "care-play": openPlay(); break;
    case "care-wash": washPet(); break;
    case "feed": feedPet(id, b); break;
    case "game": startGame(id); break;
    case "game-quit": endGame(true); break;
    case "gift": openGift(b); break;
    case "log-open": openLog(); break;
    case "log-export": exportLog().then(n => toast(`${n} Einträge exportiert`)); break;
    case "log-clear":
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Wirklich leeren?"; break; }
      logClear().then(() => { openLog(); toast("Protokoll geleert"); }); break;
    case "wheel": openWheel(); break;
    case "wheel-spin": spinWheel(); break;
    case "wheel-done": closeSheet(); render(); if (pendingLevel) setTimeout(showLevelUp, 200); break;
    case "pet": petPet(b); break;
    case "sos": openSOS(id); break;
    case "sos-tag": { const v = b.dataset.v; sosDraft.tags = sosDraft.tags.includes(v) ? sosDraft.tags.filter(x => x !== v) : sosDraft.tags.concat(v); b.setAttribute("aria-pressed", sosDraft.tags.includes(v)); break; }
    case "sos-str": sosDraft.strength = Number(b.dataset.v); $$('[data-action="sos-str"]').forEach(x => x.setAttribute("aria-pressed", x === b)); break;
    case "sos-win": sosWin(id, b); break;
    case "relapse":
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Sicher? Zähler startet neu"; break; }
      relapse(id); break;
    case "review": openReview(); break;
    case "rv-mood": reviewDraft.note = ($("#rvNote") || {}).value || reviewDraft.note; reviewDraft.mood = Number(b.dataset.v); sfx("tap"); openReview.draw(); break;
    case "rv-hard": reviewDraft.note = ($("#rvNote") || {}).value || reviewDraft.note; reviewDraft.hard = b.dataset.v; openReview.draw(); break;
    case "rv-save": {
      reviewDraft.note = ($("#rvNote") || {}).value || "";
      if (!reviewDraft.mood) { $("#rvErr").textContent = "Wähle kurz aus, wie es dir geht."; break; }
      const t = todayK(); state.pledges[t] = Object.assign(state.pledges[t] || {}, { pm: { mood: reviewDraft.mood, hard: reviewDraft.hard, note: reviewDraft.note.trim().slice(0, 200) } });
      addCoins(10); addXP(5); const r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 60); sfx("bonus");
      evaluateBadges(); save(); closeSheet(); render(); toast("Danke! Gute Nacht wünscht " + state.profile.petName + "."); break;
    }
    case "ptab": progTab = b.dataset.v; softRender("#prog"); break;
    case "stab": shopTab = b.dataset.v; softRender("#shop"); break;
    case "item": buyItem(id, b); break;
    case "theme-default": state.profile.theme = "sun"; save(); render(); break;
    case "petcolor": state.profile.petColor = b.dataset.v; sfx("chirp"); save(); render(); break;
    case "rename":
      openModal(`<h2>Neuer Name</h2><div class="field"><input type="text" id="newName" maxlength="14" value="${esc(state.profile.petName)}" aria-label="Name" autofocus></div><button class="btn full" data-action="rename-save" style="margin-top:14px">Speichern</button>`); break;
    case "rename-save": { const v = ($("#newName").value || "").trim(); if (v) { state.profile.petName = v; save(); } closeSheet(); render(); break; }
    case "add-reward": {
      const n = ($("#rwName").value || "").trim(), c = clamp(Math.round(Number($("#rwCost").value) || 0), 10, 5000);
      if (!n) { $("#rwName").focus(); break; }
      state.rewards.push({ id: uid(), name: n, cost: c }); save(); render(); toast("Belohnung hinzugefügt"); break;
    }
    case "del-reward": state.rewards = state.rewards.filter(r => r.id !== id); save(); render(); break;
    case "redeem": {
      const rw = state.rewards.find(r => r.id === id); if (!rw || state.coins < rw.cost) break;
      state.coins -= rw.cost; state.redeemed.push({ id: uid(), name: rw.name, ts: Date.now() }); state.flags.bought = (state.flags.bought || 0) + 1;
      bigCelebration(); sfx("chest"); vibrate([40, 50, 80]); evaluateBadges(); save(); render();
      openModal(`<div class="reward-orb" style="--rc:var(--gold)"><b>${I.gift.replace("<svg", '<svg width="70" height="70" style="color:#fff"')}</b></div><h2>Gönn dir: ${esc(rw.name)}</h2><p class="muted" style="font-weight:700">Verdient! Du hast hart dafür gearbeitet.</p><button class="btn gold full" data-action="close" autofocus>Genießen</button>`);
      break;
    }
    case "g-create": openGroupForm("create"); break;
    case "g-join": openGroupForm("join"); break;
    case "g-do-create": submitGroup(false); break;
    case "g-do-join": submitGroup(true); break;
    case "g-invite": openInvite(); break;
    case "g-share": shareInvite(); break;
    case "g-copy": copyText(fmtCode(state.group.code), "Code kopiert"); break;
    case "g-sort": grp.sort = b.dataset.v; softRender("#gboard"); break;
    case "g-cheer": cheerPlayer(id, b); break;
    case "g-leave":
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Wirklich verlassen?"; break; }
      leaveGroup(); break;
    case "shield-info": openModal(`<div style="width:90px;height:90px;margin:0 auto">${I.shield}</div><h2>Schutzschilde: ${state.freezes}/${MAX_SHIELDS}</h2><p class="muted" style="font-weight:700">Verpasst du einen Tag, rettet ein Schutzschild automatisch deine Serie. Neue Schilde gibt's im Shop und manchmal in Quest-Truhen.</p><button class="btn ice full" data-action="close-go-shop">Zum Shop</button>`); break;
    case "close-go-shop": closeSheet(); shopTab = "power"; location.hash = "begleiter"; break;
    case "set-haptics": state.profile.haptics = !state.profile.haptics; b.setAttribute("aria-checked", state.profile.haptics); save(); vibrate([30, 40, 30]); break;
    case "set-sound": state.profile.sound = !state.profile.sound; b.setAttribute("aria-checked", state.profile.sound); save(); sfx("tap"); break;
    case "onboard-again": openOnboarding(); break;
    case "install": if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case "backup":
      openSheet(`${sheetHead("Backup")}<p class="muted" style="margin:0;font-weight:700">Deine Daten liegen nur in diesem Browser. Lade regelmäßig ein Backup herunter, damit nichts verloren geht, z. B. beim Löschen des Browserverlaufs.</p>
        <div style="display:grid;gap:12px;margin-top:16px"><button class="btn full" data-action="backup-dl">Backup herunterladen</button>
        <label class="btn ghost full" for="restoreFile" style="cursor:pointer">Backup wiederherstellen</label><input type="file" id="restoreFile" accept=".json,application/json" hidden></div><div class="err" id="bkErr"></div>`); break;
    case "backup-dl": {
      try {
        const blob = new Blob([JSON.stringify(state, null, 1)], { type: "application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `21days-backup-${todayK()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        toast("Backup heruntergeladen");
      } catch (err) { $("#bkErr").textContent = "Download nicht möglich."; }
      break;
    }
    case "reset":
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Wirklich?"; break; }
      state = freshState(); shownXp = null; snap = null; logClear(); save(); render(); openOnboarding(); break;
    // onboarding
    case "hatch": {
      if (ob.hatched) break; const egg = $("#egg"); if (egg) egg.classList.add("crack"); sfx("shake"); vibrate([20, 60, 20, 60, 20]);
      setTimeout(() => { ob.hatched = true; drawOb(); bigCelebration(); sfx("level"); vibrate([40, 60, 120]); }, 900); break;
    }
    case "ob-color": ob.name = ($("#obName") || {}).value || ob.name; ob.color = b.dataset.v; sfx("chirp"); drawOb(); break;
    case "ob-goal": { const v = b.dataset.v; ob.goals = ob.goals.includes(v) ? ob.goals.filter(x => x !== v) : ob.goals.concat(v); sfx("tap"); drawOb(); break; }
    case "ob-back": ob.step = Math.max(0, ob.step - 1); drawOb(); break;
    case "ob-next":
      if (ob.step === 1) { ob.name = (($("#obName") || {}).value || "").trim() || "Keimi"; state.profile.petName = ob.name; state.profile.petColor = ob.color; }
      ob.step++; sfx("tap"); drawOb(); break;
    case "ob-tpl": {
      const all = TEMPLATES[b.dataset.kind], tpl = all.find(t => t.name === b.dataset.name);
      const d = draftFrom(null, tpl, b.dataset.kind); d.id = uid(); d.start = todayK(); d.quitStart = Date.now();
      state.habits.push(normHabit(d)); save(); sfx("bonus"); burst(innerWidth / 2, innerHeight * .5, 60);
      ob.step = 4; drawOb(); break;
    }
    case "ob-custom": openEditor(draftFrom(null, null, "build")); break;
    case "ob-finish": {
      state.profile.onboarded = true; if (!state.flags.welcome) { state.flags.welcome = true; addCoins(50); }
      save(); closeSheet(); location.hash = "heute"; animateNext = true; render(); bigCelebration(); sfx("bonus");
      setTimeout(() => flyCoins(innerWidth / 2, innerHeight / 2, 12), 300); break;
    }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const ov = $(".overlay"); if (ov) { ov.click(); return; } if ($('.back[data-back="1"]')) closeSheet(); }
  if (e.key === "Enter" && e.target.id === "rwName") { e.preventDefault(); $('[data-action="add-reward"]').click(); }
});
document.addEventListener("submit", e => e.preventDefault());
document.addEventListener("change", e => {
  if (e.target.id !== "restoreFile" || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try { const data = JSON.parse(fr.result); if (!data || !Array.isArray(data.habits)) throw new Error("bad"); state = migrate(data); shownXp = null; curAct = { a: "restore", t: Date.now() }; save(); closeSheet(); render(); toast("Backup wiederhergestellt", "gold"); }
    catch (err) { const el = $("#bkErr"); if (el) el.textContent = "Diese Datei ist kein gültiges 21-Days-Backup."; }
  };
  fr.readAsText(e.target.files[0]);
});

/* ============ Tickers ============ */
function updateTickers() {
  const now = Date.now();
  $$("[data-since]").forEach(el => { el.textContent = fmtSince(now - Number(el.dataset.since)); });
  $$("[data-money]").forEach(el => { const h = state.habits.find(x => x.id === el.dataset.money); if (h) el.textContent = eur(h.money * quitDays(h)); });
}
setInterval(updateTickers, 1000);
function checkQuitMilestones(silent) {
  let best = null;
  state.habits.forEach(h => {
    if (h.kind !== "break") return;
    const qd = quitDays(h);
    QUIT_MS.forEach(m => { if (qd >= m && !h.quitHit.includes(m)) { h.quitHit.push(m); addCoins(10 + m); if (!best || m > best.m) best = { m, h }; } });
  });
  if (best && !silent) pushOverlay({ kicker: "Durchgehalten", big: String(best.m), title: `${best.m === 1 ? "Tag" : "Tage"} frei: ${best.h.name}`, sub: best.h.money ? `Schon ${eur(best.h.money * quitDays(best.h))} gespart!` : "Jeder Tag macht dich stärker.", color: "#1FBF8A" });
  if (best) { evaluateBadges(); save(); }
}
let lastDay = todayK();
setInterval(() => {
  if (todayK() !== lastDay) { lastDay = todayK(); const fr = applyFreezes(); if (fr) freezeNotice(fr); save(); render(); syncGroup(); }
  if (state.profile.onboarded) checkQuitMilestones(false);
}, 30000);
function freezeNotice(fr) {
  if (fr.saved) setTimeout(() => pushOverlay({ kicker: "Serie gerettet", icon: I.shield, big: String(fr.streak), title: `${fr.saved === 1 ? "Ein Schutzschild hat" : fr.saved + " Schutzschilde haben"} deine Serie gerettet!`, sub: "Hol dir heute ein Häkchen, damit sie weiterwächst.", color: "#38B6F5", sound: "unlock" }), 600);
  else if (fr.lost) setTimeout(() => toast(`Deine ${fr.lost}-Tage-Serie ist vorbei. Heute startet eine neue!`), 800);
}

/* ============ Routing & boot ============ */
const VIEWS = ["heute", "fortschritt", "begleiter", "gruppe", "profil"];
function route() { if (location.hash.startsWith("#join=")) { handleJoinUrl(location.hash); return; } const h = location.hash.slice(1); view = VIEWS.includes(h) ? h : "heute"; animateNext = true; if (store.mode !== "loading") render(); window.scrollTo(0, 0); }
addEventListener("hashchange", route);

function afterLoad() {
  snap = takeSnap();
  const h = location.hash.slice(1); view = VIEWS.includes(h) ? h : "heute";
  const fr = state.profile.onboarded ? applyFreezes() : null;
  animateNext = true; render();
  if (!state.profile.onboarded) { openOnboarding(); return; }
  if (fr) freezeNotice(fr);
  checkQuitMilestones(false);
  evaluateBadges(); save(); syncGroup();
  if (location.hash.startsWith("#join=")) handleJoinUrl(location.hash);
}
function loadCached() {
  try { const v2 = localStorage.getItem(KEY); if (v2) return JSON.parse(v2); const v1 = localStorage.getItem(OLD_KEY); if (v1) return JSON.parse(v1); } catch (e) { /* ignore */ }
  return null;
}
function startLocal(cached, notice) {
  if (store.mode !== "loading") return;
  store.mode = "local"; store.notice = notice || ""; state = cached ? migrate(cached) : freshState(); afterLoad();
}
function init() {
  render();
  startLocal(loadCached(), "");
}
let installEvt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (view === "profil") render(); });
addEventListener("appinstalled", () => { installEvt = null; toast("21 Days ist installiert!", "gold"); });
const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (CapApp) CapApp.addListener("backButton", ({ canGoBack }) => {
  const ov = $(".overlay"); if (ov) { ov.click(); return; }
  if (game) { endGame(true); return; }
  const layer = $("#modalRoot .back"); if (layer) { if (layer.dataset.back === "1") closeSheet(); return; }
  if (canGoBack) history.back(); else CapApp.exitApp();
});
if (CapApp) { // invite links that open the app: days21://join/CODE
  CapApp.addListener("appUrlOpen", e => handleJoinUrl(e.url));
  CapApp.getLaunchUrl().then(r => { if (r && r.url) handleJoinUrl(r.url); }).catch(() => {});
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  syncGroup(); if (view === "gruppe") loadBoard();
  if (!$(".back") && !$(".overlay")) render();
});
const inApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if (!inApp && "serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
init();
})();
</script>
