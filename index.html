<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>21 Days</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FF6B2C">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Design: calm grouped lists in the style of iOS. System type, one accent (the theme color), semantic colors with light and dark variants.
   Habits are the content; rewards and extras sit below them. Contrast on --card: --ink 16:1, --muted 5.1:1, --pb under white text 5.6:1, --bad 5.4:1. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card-2:#E9E9EE; --ink:#1C1C1E; --muted:#6C6C70; --line:#DCDCE1; --seg-on:#FFFFFF;
  /* --p0 is the raw theme color. --pb sits behind white text (>= 4.4:1 for every theme), --p is accent text and rings. */
  --p0:#FF6B2C; --pb:color-mix(in srgb,var(--p0) 68%,#000); --p:var(--pb); --p-dark:color-mix(in srgb,var(--p0) 48%,#000);
  --hk:72%;
  --sat:env(safe-area-inset-top,var(--safe-area-inset-top,0px)); --sab:env(safe-area-inset-bottom,var(--safe-area-inset-bottom,0px));
  --p-soft:color-mix(in srgb,var(--p0) 13%,var(--card));
  --ok:#30B158; --ok-dark:#1A7F37; --ok-soft:color-mix(in srgb,var(--ok) 14%,var(--card));
  --gold:#FFBF1F; --gold-dark:#946500; --gold-soft:color-mix(in srgb,var(--gold) 18%,var(--card));
  --ice:#38B6F5; --ice-dark:#0A6FA8; --ice-soft:color-mix(in srgb,var(--ice) 14%,var(--card));
  --bad:#D70015; --grape:#7C3AED;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-r:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --card-2:#2C2C2E; --ink:#F5F5F7; --muted:#A1A1A6; --line:#38383A; --seg-on:#636366;
    --p:color-mix(in srgb,var(--p0) 60%,#fff); --hk:100%; --gold-dark:#F5B829; --ice-dark:#64C8FF; --bad:#FF6961; --grape:#A78BFA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{ --bg:#000000; --card:#1C1C1E; --card-2:#2C2C2E; --ink:#F5F5F7; --muted:#A1A1A6; --line:#38383A; --seg-on:#636366; --p:color-mix(in srgb,var(--p0) 60%,#fff); --hk:100%; --gold-dark:#F5B829; --ice-dark:#64C8FF; --bad:#FF6961; --grape:#A78BFA; color-scheme:dark; }
@media (prefers-contrast: more){ :root{ --line:#8A8A90; --muted:#48484C } .card,.hlist,.list,.tile,.week{outline:1px solid var(--line)} }
@media (prefers-contrast: more) and (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --line:#8E8E93; --muted:#D1D1D6 } }
@media (prefers-reduced-transparency: reduce){ .topbar,.nav{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)} .nav{background:var(--card)} }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
html,body{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,[data-action],.opt,.switch{touch-action:manipulation}
h1,h2,h3{margin:0;line-height:1.2;font-weight:700;text-wrap:balance}
:focus-visible{outline:3px solid var(--p);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.shell{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + var(--sab));position:relative}

/* Navigation bar: large title, streak and coins, add button on Heute */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:calc(10px + var(--sat)) 16px 8px;margin:0 -16px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.topbar h1{flex:1;min-width:0;font-family:var(--font-r);font-size:clamp(1.625rem,7vw,2.125rem);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 11px;border-radius:99px;background:var(--card);font-weight:600;font-size:.9375rem}
.chip svg{width:18px;height:18px}
.chip.flame{color:var(--p)}
.chip.flame.cold{color:var(--muted)}
.chip.flame.cold svg{opacity:.45;filter:grayscale(1)}
.chip.coins{color:var(--gold-dark)}
.chip.bump{animation:bump .5s cubic-bezier(.32,.72,0,1)}
.tb-add{flex:none;width:36px;height:36px;border-radius:50%;background:var(--pb);color:#fff;display:grid;place-items:center}
.tb-add svg{width:20px;height:20px}
.tb-add:active{opacity:.7}

/* Tab bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:4px 8px calc(4px + var(--sab))}
.nav-in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;padding:4px 2px;color:var(--muted);font-weight:500;font-size:.6875rem;transition:color .2s ease}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--p)}

/* Surfaces, sections, buttons */
.card{background:var(--card);border-radius:var(--r);padding:16px}
.sec{margin-top:16px}
.stack{display:grid;gap:10px}
.sub{margin:0 4px;color:var(--muted);font-size:.9375rem}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 4px 8px}
.sec-h h2{font-size:1.25rem}
.sec-h .muted{font-size:.9375rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:14px;background:var(--pb);color:#fff;font-weight:600;font-size:1.0625rem;transition:opacity .15s ease,transform .1s ease}
.btn:active{opacity:.75;transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.full{width:100%}
.btn.ok{background:var(--ok-dark)}
.btn.gold{background:var(--gold);color:#3A2800}
.btn.ice{background:var(--ice);color:#06263D}
.btn.ghost{background:var(--p-soft);color:var(--p)}
.btn.danger{background:color-mix(in srgb,var(--bad) 10%,var(--card));color:var(--bad)}
.btn.sm{min-height:36px;padding:7px 14px;font-size:.9375rem;border-radius:99px}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{display:inline-flex;align-items:center;min-height:44px;color:var(--p);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--card-2);color:var(--muted)}

/* Grouped list rows (settings, routines, links) */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px;text-align:left}
.list>.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.list>.row:has(.hicon)+.row::before{left:64px}
button.row:active{background:var(--card-2)}
.row-t{flex:1;min-width:0}
.row-t b{display:block;font-weight:500;overflow-wrap:anywhere}
.row-t small{display:block;color:var(--muted);font-size:.8125rem;overflow-wrap:anywhere}
.row>svg{flex:none;width:16px;height:16px;color:var(--muted)}
.row .x{flex:none}
.row .x[disabled]{opacity:.3}

/* Pet hero */
.hero{display:flex;align-items:center;gap:8px;padding:12px 14px;margin-top:6px;background:linear-gradient(160deg,var(--p-soft),var(--card) 70%);border:1px solid var(--line);border-radius:26px;position:relative;overflow:hidden}
.hero .petbox{flex:none;width:128px;height:128px;cursor:pointer}
.hero-r{flex:1;min-width:0}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;font-weight:600;font-size:0.9375rem}
.bubble::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble.say{animation:say .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes say{from{transform:scale(.85);opacity:.3}}
.energy{margin-top:10px}
.energy-top{display:flex;justify-content:space-between;font-size:0.8125rem;font-weight:600;color:var(--muted)}
.ebar{height:14px;border-radius:99px;background:var(--card-2);overflow:hidden;margin-top:4px;border:1px solid var(--line)}
.ebar i{position:relative;display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),#7BE495);transition:width .8s cubic-bezier(.2,1.2,.3,1);overflow:hidden}
.ebar i::after,.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 2.8s ease-in-out infinite}
@keyframes shimmer{60%,100%{transform:translateX(100%)}}

/* Pet SVG animation */
.pet{width:100%;height:100%;overflow:visible}
.pet .body-g{transform-origin:100px 185px;animation:idle 2.8s ease-in-out infinite}
.pet.happy .body-g{animation:hop 1.1s ease-in-out infinite}
.pet.sleepy .body-g{animation:idle 4.5s ease-in-out infinite}
.pet .eyes{transform-origin:100px 108px;animation:blink 4.2s infinite}
.pet .arm-l{transform-origin:46px 128px;animation:wave 2.8s ease-in-out infinite}
.pet .arm-r{transform-origin:154px 128px;animation:wave2 2.8s ease-in-out infinite}
.pet.happy .arm-l{animation:waveBig .55s ease-in-out infinite}
.pet.happy .arm-r{animation:waveBig2 .55s ease-in-out infinite}
.pet .sprout{transform-origin:100px 62px;animation:sproutSway 3s ease-in-out infinite}
.pet .zzz{animation:zzz 2.5s ease-in-out infinite}
.pet .spark{animation:spark 1.6s ease-in-out infinite}
.pet.jump .body-g{animation:jump .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes idle{50%{transform:scale(1.03,.97)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-10px) scale(.97,1.04)}55%{transform:translateY(0) scale(1.05,.95)}}
@keyframes jump{0%{transform:scale(1.1,.85)}40%{transform:translateY(-34px) scale(.92,1.1)}75%{transform:translateY(0) scale(1.08,.92)}100%{transform:scale(1)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wave{50%{transform:rotate(-8deg)}}
@keyframes wave2{50%{transform:rotate(8deg)}}
@keyframes waveBig{50%{transform:rotate(-40deg)}}
@keyframes waveBig2{50%{transform:rotate(40deg)}}
@keyframes sproutSway{50%{transform:rotate(7deg)}}
@keyframes zzz{0%{opacity:0;transform:translate(0,0)}50%{opacity:1}100%{opacity:0;transform:translate(10px,-16px)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.wday{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:0.75rem;font-weight:600;color:var(--muted)}
.wday.today{color:var(--p)}
.wday svg{width:36px;height:36px;transform:rotate(-90deg)}
.wday circle{fill:none;stroke-width:4}
.wday .t{stroke:var(--card-2)}
.wday .v{stroke:var(--ok);stroke-linecap:round}
.wday .full{fill:var(--ok)}
.wday .ice{fill:var(--ice)}
.wbox{position:relative;width:36px;height:36px}
.wbox span{position:absolute;inset:0;display:grid;place-items:center;font-size:min(0.75rem,15px);font-weight:700;color:var(--ink)}
.wbox span svg{width:16px;height:16px;transform:none;color:#fff}

/* Pledge, quests */
.pledge{display:flex;align-items:center;gap:14px}
.pledge .btn{flex:none}
.pledge .pi{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-dark)}
.pledge .pi svg{width:30px;height:30px}
.pledge h3{font-size:1.0625rem}
.pledge p{margin:2px 0 0;font-size:0.875rem;color:var(--muted);font-weight:400}
.hold{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hold::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.4);transform:scaleX(0);transform-origin:left;transition:transform .15s}
.hold.holding::before{transform:scaleX(1);transition:transform 1.1s linear}
.hold span{position:relative}
.quest{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.quest:last-of-type{border-bottom:0}
.qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--p-soft);color:var(--p)}
.qi svg{width:22px;height:22px}
.quest b{display:block;font-size:0.9375rem}
.qbar{height:12px;border-radius:99px;background:var(--card-2);overflow:hidden;margin-top:5px}
.qbar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .6s cubic-bezier(.2,1.2,.3,1)}
.quest.claimed .qi{background:var(--ok-soft);color:var(--ok)}
.quest.claimed b{color:var(--muted);text-decoration:line-through}
.qr{font-size:0.8125rem;font-weight:700;color:var(--gold-dark);display:flex;align-items:center;gap:3px;white-space:nowrap}
.qr svg{width:16px;height:16px}
.chest-btn{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:12px 14px;border-radius:18px;text-align:left;background:linear-gradient(135deg,var(--gold-soft),var(--p-soft));border:2px solid var(--gold);animation:chestGlow 1.8s ease-in-out infinite}
.chest-btn h3{font-size:1.0625rem}
.chest-btn p{margin:2px 0 0;font-size:0.8125rem;color:var(--muted);font-weight:500}
.chest{width:64px;height:58px;flex:none;animation:bob 1.6s ease-in-out infinite}
.chest-btn.shake .chest{animation:shake .45s ease-in-out 3}
.chest-btn.locked{animation:none;border-color:var(--line);background:var(--card-2)}
.chest-btn.locked .chest{animation:none;filter:grayscale(1);opacity:.5}
@keyframes chestGlow{50%{box-shadow:0 0 26px color-mix(in srgb,var(--gold) 55%,transparent)}}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
@keyframes shake{25%{transform:rotate(-14deg) scale(1.08)}75%{transform:rotate(14deg) scale(1.08)}}

/* Habit cards */
.group-h{margin:20px 4px 8px;font-size:0.8125rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.group-h svg{width:16px;height:16px}
.hlist{display:grid;gap:10px}
.hcard{position:relative;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .1s}
.hcard:active{transform:scale(.99)}
.hcard.done{background:color-mix(in srgb,var(--hc) 9%,var(--card));border-color:color-mix(in srgb,var(--hc) 45%,var(--line))}
.hicon{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--hc) 16%,var(--card));color:color-mix(in srgb,var(--hc) var(--hk),#000)}
.hicon svg{width:28px;height:28px}
.hbody{flex:1;min-width:0}
.hname{font-weight:700;font-size:1.0625rem;line-height:1.2;overflow-wrap:anywhere}
.hcard.done .hname{color:color-mix(in srgb,var(--ink) 70%,var(--muted))}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:3px;font-size:0.8125rem;font-weight:600;color:var(--muted)}
.hmeta .fl{display:inline-flex;align-items:center;gap:2px;color:var(--p)}
.hmeta .fl svg{width:14px;height:14px}
.hmeta .fl.zero{color:var(--muted)}
.hmeta .saved{color:var(--ok)}
.hwarn{margin-top:5px;font-size:0.75rem;font-weight:600;color:var(--p)}
.sos{flex:none;min-height:44px;padding:8px 10px;border-radius:12px;background:var(--ice-soft);color:var(--ice-dark);font-weight:700;font-size:0.8125rem;border:2px solid color-mix(in srgb,var(--ice) 40%,var(--line))}
.hcheck{flex:none;position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);color:var(--muted)}
.hcheck svg.ring{position:absolute;inset:0;width:58px;height:58px;transform:rotate(-90deg)}
.hcheck circle{fill:none;stroke-width:5}
.hcheck .t{stroke:var(--line)}
.hcheck .v{stroke:color-mix(in srgb,var(--hc) var(--hk),#000);stroke-linecap:round;transition:stroke-dashoffset .45s cubic-bezier(.2,1.2,.3,1)}
.hcheck .ck{width:28px;height:28px;position:relative}
.hcheck .cnt{position:relative;font-weight:700;font-size:0.875rem;color:var(--ink)}
.hcheck.done{background:color-mix(in srgb,var(--hc) 74%,#000);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--hc) 65%,#000)}
.hcheck.done .t,.hcheck.done .v{stroke:transparent}
.hcheck:active{transform:scale(.92)}
.hcheck.pop{animation:pop .4s cubic-bezier(.34,1.4,.64,1)}
.hcheck.pop .ck path{animation:draw .45s .05s ease-out both}
.hcheck .ck path{stroke-dasharray:24}
.hcheck.pop::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:4px solid var(--hc);animation:ripple .65s ease-out forwards;pointer-events:none}
.hcheck.tick{animation:tick .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes tick{50%{transform:scale(1.12)}}
@keyframes draw{from{stroke-dashoffset:24}}
@keyframes ripple{to{inset:-22px;opacity:0}}
.hcard.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-100%);animation:sweep .9s ease-out forwards;pointer-events:none}
@keyframes sweep{to{transform:translateX(100%)}}
.off-list .hcard{opacity:.6}
.empty{text-align:center;padding:28px 18px}
.empty h2{font-size:1.375rem}
.empty p{color:var(--muted);font-weight:400;max-width:36ch;margin:8px auto 16px}

/* Generic animation */
.anim .enter{animation:enter .4s cubic-bezier(.22,1,.36,1) both;animation-delay:min(calc(var(--i,0) * 35ms),280ms)}
@keyframes enter{from{transform:translateY(10px);opacity:0}}
@keyframes bump{40%{transform:scale(1.3) rotate(-6deg)}100%{transform:scale(1)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.2) rotate(5deg)}}

/* Stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.tile .tv{display:flex;align-items:center;gap:6px;font-size:1.75rem;font-weight:700;line-height:1.1}
.tile .tv svg{width:26px;height:26px}
.tile span{font-size:0.8125rem;font-weight:500;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dh{font-size:0.75rem;font-weight:700;color:var(--muted)}
.cal .d{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:0.8125rem;font-weight:600;color:var(--muted)}
.cal .d.on{background:var(--pb);color:#fff}
.cal .d.ice{background:var(--ice);color:#fff}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--p);color:var(--p)}
.cal .d.on.today{color:#fff;box-shadow:0 0 0 3px var(--p-soft)}
.cal .d.fut{opacity:.35}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--card-2)}
.heat i.l1{background:color-mix(in srgb,var(--ok) 35%,var(--card-2))}
.heat i.l2{background:color-mix(in srgb,var(--ok) 65%,var(--card-2))}
.heat i.l3{background:var(--ok)}
.heat i.na{opacity:.3}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;border-bottom:1px solid var(--line)}
.bars .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars .col i{display:block;width:100%;max-width:34px;border-radius:9px 9px 3px 3px;background:var(--p);min-height:4px}
.bars .col.best i{background:var(--gold)}
.bars .col small{font-size:0.6875rem;font-weight:600;color:var(--muted)}
.blabels{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:0.75rem;font-weight:700;color:var(--muted);margin-top:6px}
.hstat{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hstat:last-child{border-bottom:0}
.hstat .hicon{width:40px;height:40px;border-radius:12px}
.hstat .hicon svg{width:22px;height:22px}
.rbar{height:10px;border-radius:99px;background:var(--card-2);overflow:hidden;margin-top:4px}
.rbar i{display:block;height:100%;background:var(--hc);border-radius:99px}
.hb{display:grid;grid-template-columns:110px 1fr 28px;align-items:center;gap:10px;font-size:0.875rem;font-weight:500;margin-top:8px}
.hb .rbar{margin:0}
.hb .rbar i{background:var(--p)}
.mood-chart svg{width:100%;height:120px}
.seg{display:flex;gap:6px;background:var(--card-2);padding:4px;border-radius:14px}
.seg button{flex:1;min-height:44px;padding:8px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.logrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:0.875rem}
.logrow:last-child{border-bottom:0}
.logrow .lb{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700}
.lb.res{background:var(--ok-soft);color:var(--ok-dark)}
.lb.gave{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}

/* Pet tab, shop */
.pet-stage{position:relative;text-align:center;padding:18px 14px 16px;border-radius:28px;background:radial-gradient(circle at 50% 70%,var(--p-soft),var(--card) 70%);border:1px solid var(--line)}
.pet-stage .petbox{width:200px;height:200px;margin:0 auto;cursor:pointer}
.pet-stage h2{font-size:1.625rem}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center}
.item .iv{width:64px;height:64px;display:grid;place-items:center}
.item .iv svg{width:64px;height:64px}
.item b{font-size:0.8125rem;line-height:1.2}
.item .price{display:inline-flex;align-items:center;gap:3px;font-size:0.8125rem;font-weight:700;color:var(--gold-dark)}
.item .price svg{width:15px;height:15px}
.item.owned .price{color:var(--ok-dark)}
.item.on{border-color:var(--ok);background:var(--ok-soft)}
.item.cant{opacity:.55}
.swatches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.reward-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.reward-row:last-child{border-bottom:0}
.reward-row b{flex:1}

/* Friends & profile */
.lb-row{display:grid;grid-template-columns:28px 42px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.lb-row.me{border-color:var(--p);background:var(--p-soft)}
.rank{font-weight:700;font-size:1.125rem;text-align:center;color:var(--muted)}
.rank.r1{color:var(--gold-dark)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#1A1F33;background:var(--av)}
.lb-name{min-width:0}
.lb-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-name span{font-size:0.75rem;font-weight:500;color:var(--muted)}
.lb-right{display:flex;align-items:center;gap:8px}
.lb-xp{text-align:right;font-weight:700}
.lb-xp small{display:block;font-size:0.6875rem;color:var(--muted);font-weight:500}
.profile-head{display:flex;align-items:center;gap:14px}
.profile-head .petbox{width:90px;height:90px;flex:none}
.xpbar{height:16px;border-radius:99px;background:var(--card-2);overflow:hidden;border:1px solid var(--line);margin-top:6px}
.xpbar i{position:relative;display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--grape),#C084FC);overflow:hidden}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bcard{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:12px 6px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.bcard b{font-size:0.75rem;line-height:1.2}
.bcard small{font-size:0.6875rem;color:var(--muted);font-weight:500;line-height:1.25}
.bcard.locked .bdg{filter:grayscale(1);opacity:.3}
.bcard.locked b{color:var(--muted)}
.bdg{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--rc) 65%,#fff),var(--rc));box-shadow:0 4px 0 color-mix(in srgb,var(--rc) 60%,#000),inset 0 2px 0 rgba(255,255,255,.4);transform:rotate(-5deg)}
.bdg svg{width:28px;height:28px}
.rarity{font-size:0.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--rc) 65%,var(--ink))}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;color:var(--muted);font-weight:400}
.switch{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch::before{content:"";position:absolute;inset:-6px -2px}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{left:24px}

/* Sheets & modals */
.back{position:fixed;inset:0;z-index:50;background:rgba(9,12,28,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.back.center{align-items:center;padding:16px}
.sheet{width:100%;max-width:480px;max-height:94%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px 28px;animation:up .38s cubic-bezier(.32,.72,0,1)}
.sheet.full{height:100%;max-height:100%;border-radius:0}
.sheet-grip{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h2{font-size:1.375rem}
.x{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.x svg{width:20px;height:20px}
.modal{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:22px;text-align:center;animation:rise .32s cubic-bezier(.32,.72,0,1)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes rise{from{transform:translateY(20px) scale(.95);opacity:0}}
.field{display:grid;gap:6px;margin-top:14px}
.field > label,.field > .lbl{font-weight:700;font-size:0.875rem}
.field small{color:var(--muted);font-weight:400}
input[type=text],input[type=number],textarea,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:500}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--p)}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:0.875rem}
.opt[aria-pressed="true"]{border-color:var(--p);background:var(--p-soft);color:var(--p)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:0.8125rem}
.daypick button[aria-pressed="true"]{background:var(--pb);border-color:var(--pb);color:#fff}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.iconpick button{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted)}
.iconpick button svg{width:24px;height:24px}
.iconpick button[aria-pressed="true"]{border-color:var(--hc);color:var(--hc);background:color-mix(in srgb,var(--hc) 14%,var(--card))}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;border:1px solid var(--line);background:var(--card);text-align:left;font-weight:600;font-size:0.875rem;line-height:1.2}
.tpl .hicon{width:40px;height:40px;border-radius:12px}
.tpl .hicon svg{width:22px;height:22px}
.err{color:var(--bad);font-weight:600;font-size:0.875rem;min-height:1em;margin-top:8px}
.big-counter{font-size:2.5rem;font-weight:700;line-height:1}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mini-cal i{aspect-ratio:1;border-radius:6px;background:var(--card-2)}
.mini-cal i.on{background:var(--hc)}
.mini-cal i.na{opacity:.25}
.mini-cal i.today{box-shadow:inset 0 0 0 2px var(--ink)}
.ms-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.ms{flex:none;width:64px;padding:8px 4px;border-radius:14px;text-align:center;background:var(--card-2);font-size:0.75rem;font-weight:600;color:var(--muted)}
.ms b{display:block;font-size:1.125rem;color:var(--ink)}
.ms.hit{background:var(--ok-soft);color:var(--ok-dark)}
.reason{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;margin-top:8px}
.reason svg{width:20px;height:20px;color:var(--bad);flex:none}
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;aspect-ratio:1;max-width:62px;border-radius:18px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.mood svg{width:38px;height:38px}
.mood[aria-pressed="true"]{border-color:var(--p);background:var(--p-soft);transform:scale(1.06)}
.breath-wrap{display:grid;place-items:center;height:240px;position:relative}
.breath{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ice) 70%,#fff),var(--ice));box-shadow:0 0 50px color-mix(in srgb,var(--ice) 50%,transparent);animation:breathe 12s ease-in-out infinite;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.375rem}
@keyframes breathe{0%{transform:scale(.5)}33%{transform:scale(1)}66%{transform:scale(1)}100%{transform:scale(.5)}}
.breath span{animation:none}

/* Onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;padding:20px 4px 10px;text-align:center}
.ob h1{font-size:1.875rem;margin-top:10px}
.ob p{color:var(--muted);font-weight:500;margin:8px auto 0;max-width:34ch}
.ob .grow{flex:1;display:flex;flex-direction:column;justify-content:center}
.ob .foot{display:grid;gap:10px;margin-top:20px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:width .2s}
.dots i.on{width:24px;background:var(--p)}
.egg{width:180px;height:210px;margin:0 auto;cursor:pointer;animation:wobble 2.2s ease-in-out infinite;transform-origin:50% 90%}
.egg.crack{animation:crack .12s linear infinite}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-8deg)}84%{transform:rotate(8deg)}92%{transform:rotate(-4deg)}}
@keyframes crack{50%{transform:rotate(6deg) scale(1.03)}0%,100%{transform:rotate(-6deg)}}
.ob-pet{width:200px;height:200px;margin:0 auto;animation:hatch .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes hatch{from{transform:scale(.2) translateY(40px);opacity:0}}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.goal{padding:14px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:0.9375rem;display:flex;gap:10px;align-items:center}
.goal svg{width:26px;height:26px;flex:none;color:var(--p)}
.goal[aria-pressed="true"]{border-color:var(--p);background:var(--p-soft)}
.how{display:grid;gap:10px;text-align:left}
.how div{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.how svg{width:30px;height:30px;flex:none}

/* Wheel of fortune: pointer stays still, only the disc turns. Labels carry the meaning, color is decoration. */
.wheel-wrap{position:relative;width:min(300px,100%);aspect-ratio:1;margin:18px auto 8px}
.wheel{width:100%;height:100%;transition:transform 4.4s cubic-bezier(.12,.7,.1,1)}
.wheel svg{display:block;width:100%;height:100%}
.wheel-ptr{position:absolute;left:50%;top:-10px;width:26px;height:30px;margin-left:-13px;color:var(--ink)}
.wheel-prize{min-height:34px;margin:6px 0 10px;font-size:1.5rem;font-weight:700}
.chest-btn:disabled{cursor:default}

/* Care: needs, food tray, rooms, minigames */
.scene{position:relative;border-radius:22px;overflow:hidden;padding-top:8px}
.sc-meadow{background:linear-gradient(#BDE8FF 0 64%,#7FD66A 64%)}
.sc-sky{background:linear-gradient(#5AA9FF,#CDEBFF)}
.sc-night{background:radial-gradient(circle,#fff 1px,transparent 1.6px) 0 0/34px 34px,linear-gradient(#141B4D,#3B2F7A)}
.sc-candy{background:repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 14px,transparent 14px 28px),linear-gradient(135deg,#FFD1E8,#FFF1B8)}
.bgprev{display:block;width:64px;height:64px;border-radius:16px}
.stats{display:grid;gap:10px}
.stat{display:grid;grid-template-columns:64px 1fr 32px;align-items:center;gap:10px;font-size:.875rem;font-weight:600}
.stat b{text-align:right}
.sbar{height:14px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .6s cubic-bezier(.2,1.2,.3,1)}
.sbar i.low{background:var(--bad)}
.foodline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-weight:600;font-size:.875rem}
.care-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tray .item{padding:8px 2px 10px}
.tray .item .iv,.tray .item .iv svg{width:44px;height:44px}
.tray-hint{margin:10px 0 0;font-size:.8125rem;font-weight:400}
.flyfood{position:fixed;z-index:75;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none}
.suds{position:fixed;z-index:75;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 30%,#fff,rgba(160,220,255,.6));border:2px solid rgba(255,255,255,.85)}
.pet.eat .body-g{animation:chomp .45s ease-in-out 2}
@keyframes chomp{50%{transform:scale(1.1,.88)}}
.pet.flip .body-g{transform-origin:100px 120px;animation:flip .8s ease-in-out}
@keyframes flip{50%{transform:translateY(-46px) rotate(180deg)}100%{transform:rotate(360deg)}}
.game-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.game-h b{font-size:1.75rem}
.game-h .grow{margin-left:auto;font-size:1.75rem;font-weight:700}
.stage{position:relative;height:calc(100% - 64px);min-height:320px;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(#BDE8FF,#E8F7FF 70%,#7FD66A 70%)}
.stage.jolt{animation:jolt .3s}
@keyframes jolt{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.g-pet{position:absolute;left:0;bottom:0;width:76px;height:76px}
.g-item{position:absolute;left:0;top:0;width:40px;height:40px;pointer-events:none}
.g-item svg{display:block;width:100%;height:100%}
.bub{position:absolute;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 30% 30%,#fff,rgba(120,200,255,.55) 60%,rgba(70,160,255,.8));border:3px solid rgba(255,255,255,.9)}
.bub.gold{background:radial-gradient(circle at 30% 30%,#FFF6C2,#FFC21F)}
.nav button.dot{position:relative}
.nav button.dot::after{content:"";position:absolute;top:6px;left:calc(50% + 10px);width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.tpl[disabled]{opacity:.5}
.seg.scroll{overflow-x:auto}
.seg.scroll button{flex:1 0 auto;padding:8px 14px;white-space:nowrap}

/* Vocabulary pack */
mark{background:color-mix(in srgb,var(--p) 22%,transparent);color:inherit;border-radius:6px;padding:0 4px;font-weight:700}
.pk-ov{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;overflow:auto;color:#fff;background:radial-gradient(circle at 50% 28%,#3B1E7A,#0E0B26 72%);animation:fade .25s}
.pk-ov.out{opacity:0;transition:opacity .2s ease;pointer-events:none}
.pk-ov.flash::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,#fff,rgba(255,220,120,.7) 30%,transparent 66%);animation:pkflash .85s ease-out forwards}
@keyframes pkflash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.pk-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + var(--sat)) 18px 6px;font-weight:700;font-size:1.0625rem}
.pk-top .x{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.pk-stage{flex:1;display:grid;place-items:center;padding:8px 18px;min-height:340px;position:relative}
.pk-info{width:100%;max-width:480px;margin:0 auto;padding:0 18px}
.pk-foot{width:100%;max-width:480px;margin:0 auto;display:grid;gap:10px;padding:12px 18px calc(18px + var(--sab))}
.pk-hint{margin:0;text-align:center;font-weight:500;opacity:.88}
.pk-pack{position:relative;width:200px;height:280px;touch-action:none;user-select:none;-webkit-user-select:none;--ch:0;animation:pkfloat 3.2s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(0,0,0,.5)) drop-shadow(0 0 calc(var(--ch) * 38px) rgba(255,205,70,var(--ch)))}
.pk-lid{position:absolute;left:0;top:0;width:200px;height:56px;overflow:hidden}
.pk-body{position:absolute;left:0;top:56px;width:200px;height:224px;overflow:hidden}
.pk-pack svg{display:block}
.pk-pack.charging{animation:pkshake calc(.46s - var(--ch) * .34s) linear infinite}
@keyframes pkfloat{50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes pkshake{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(calc(var(--ch) * -6px),calc(var(--ch) * 2px)) rotate(calc(var(--ch) * -3deg))}40%{transform:translate(calc(var(--ch) * 5px),calc(var(--ch) * -3px)) rotate(calc(var(--ch) * 2deg))}60%{transform:translate(calc(var(--ch) * -4px),calc(var(--ch) * 3px)) rotate(calc(var(--ch) * -2deg))}80%{transform:translate(calc(var(--ch) * 6px),0) rotate(calc(var(--ch) * 3deg))}}
.pk-pack.tear{animation:none}
.pk-pack.tear .pk-lid{animation:lidfly .9s cubic-bezier(.4,0,.2,1) forwards}
.pk-pack.tear .pk-body{animation:bodydrop .85s .12s cubic-bezier(.5,0,1,.6) forwards}
@keyframes lidfly{to{transform:translate(90px,-260px) rotate(42deg);opacity:0}}
@keyframes bodydrop{to{transform:translateY(60px) scale(.8);opacity:0}}
.pk-card{--rc:#7A86A8;position:relative;width:min(66vw,248px);aspect-ratio:5/7;perspective:1000px;cursor:pointer;transition:width .45s cubic-bezier(.32,.72,0,1)}
.pk-ov.reading .pk-card{width:min(40vw,150px)}
.pk-ov.reading .pk-stage{min-height:0;flex:none;padding-top:0}
.pk-card.in{animation:pkin .65s cubic-bezier(.22,1,.36,1)}
@keyframes pkin{from{transform:translateY(120px) rotate(-8deg) scale(.8);opacity:0}}
.pk-card-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,.05,.15,1)}
.pk-card.flipped .pk-card-in{transform:rotateY(180deg)}
.pk-face{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pk-back{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#4C1D95 0 12px,#5B21B6 12px 24px);border:5px solid #E9D5FF}
.pk-logo{display:grid;place-items:center;gap:2px;font-size:2.6rem;font-weight:700}
.pk-logo svg{width:64px;height:64px}
.pk-front{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center;color:#1A1F33;background:linear-gradient(155deg,color-mix(in srgb,var(--rc) 28%,#fff),color-mix(in srgb,var(--rc) 80%,#fff));border:5px solid color-mix(in srgb,var(--rc) 70%,#fff)}
.pk-rar{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.pk-art small{display:block;font-weight:600;font-size:.9rem;opacity:.75}
.pk-word{display:block;font-size:clamp(1.4rem,6.5vw,2rem);line-height:1.1;overflow-wrap:anywhere;hyphens:auto}
.pk-type{padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.6);font-size:.8125rem;font-weight:600}
.pk-new{position:absolute;top:10px;right:10px;padding:2px 7px;border-radius:8px;background:#1A1F33;color:#fff;font-size:.6875rem;font-weight:700}
.pk-ov.reading .pk-art small,.pk-ov.reading .pk-type{display:none}
.pk-ov.reading .pk-word{font-size:1.05rem}
.pk-card[data-rar="rare"] .pk-front::after,.pk-card[data-rar="epic"] .pk-front::after,.pk-card[data-rar="legend"] .pk-front::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.6) 45%,transparent 65%);background-size:260% 100%;mix-blend-mode:soft-light;animation:holo 2.6s linear infinite}
.pk-card[data-rar="legend"] .pk-front::after{background:linear-gradient(115deg,#ff6b6b,#ffd93d,#6bff95,#4dd0ff,#c77dff,#ff6b6b);background-size:300% 100%;opacity:.4;mix-blend-mode:overlay;animation-duration:3s}
@keyframes holo{to{background-position:-260% 0}}
.pk-card.charging::before{content:"";position:absolute;inset:-16px;border-radius:32px;pointer-events:none;background:radial-gradient(circle,var(--rc),transparent 68%);filter:blur(8px);animation:pkaura 1s ease-in forwards}
.pk-card[data-rar="legend"].charging::before{animation-duration:1.6s}
.pk-card.charging .pk-card-in{animation:pkcharge .2s linear infinite}
@keyframes pkaura{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1.2)}}
@keyframes pkcharge{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-1.5deg)}75%{transform:translate(3px,-1px) rotate(1.5deg)}}
.pk-read{padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);animation:enter .4s cubic-bezier(.22,1,.36,1) both}
.pk-read p{margin:10px 0 0;font-weight:400;line-height:1.45}
.pk-read b{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.pk-read mark,.pk-mini mark{background:color-mix(in srgb,var(--rc,#FFBF1F) 60%,transparent);color:#fff}
.pk-meta{display:flex;flex-wrap:wrap;gap:8px}
.pk-pill{padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.16);font-size:.75rem;font-weight:700}
.pk-sum{display:grid;gap:10px;width:100%;max-width:480px;align-self:start}
.pk-mini{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.1);border:2px solid color-mix(in srgb,var(--rc) 65%,transparent);animation:enter .45s cubic-bezier(.22,1,.36,1) both}
.pk-mini .tag{display:block;font-size:.75rem;font-weight:700;color:color-mix(in srgb,var(--rc) 45%,#fff)}
.pk-mini b{font-size:1.15rem}
.pk-mini p{margin:4px 0 0;font-size:.875rem;font-weight:400}

/* Group */
.qrcode{width:min(240px,70vw);margin:8px auto 0;padding:10px;background:#fff;border-radius:16px;line-height:0}
.qrcode svg{display:block;width:100%;height:auto}
.codebox{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:1.5rem;font-weight:700;letter-spacing:.12em}
.priv{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.priv>span{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--ok-soft);color:var(--ok-dark)}
.priv.no>span{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.priv>span svg{width:18px;height:18px}

/* Journal */
.jrow{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.jrow:last-child{border-bottom:0}
.jmeta{display:flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:600}
.jmood svg{display:block;width:18px;height:18px}
.jtext{margin-top:4px;font-weight:400;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Smooth state changes and exits */
.btn,.opt,.seg button,.daypick button,.iconpick button,.sw,.mood,.item,.tpl,.goal,.ck,.x,.chip{transition:background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .12s ease,opacity .18s ease}
.opt:active,.seg button:active,.daypick button:active,.iconpick button:active,.sw:active,.mood:active,.item:active,.tpl:active,.goal:active,.ck:active,.x:active{transform:scale(.96)}
.switch,.switch::after{transition:background-color .2s ease,left .2s cubic-bezier(.32,.72,0,1)}
.back.closing{animation:fadeOut .2s ease forwards;pointer-events:none}
.back.closing .sheet{animation:down .22s cubic-bezier(.4,0,1,1) forwards}
.back.closing .modal{animation:fall .18s ease-in forwards}
.overlay.out{opacity:0;transition:opacity .2s ease;pointer-events:none}
@keyframes fadeOut{to{opacity:0}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fall{to{transform:translateY(12px) scale(.97);opacity:0}}

/* Tasks, tags, boss */
.struck{text-decoration:line-through}
.overdue{color:var(--bad)}
.tagbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:10px}
.tagbar .opt{flex:none;white-space:nowrap}
.ck-row{display:flex;align-items:center;gap:10px;padding:2px 0}
.ck-row span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
button.ck{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:#fff}
button.ck.on{background:var(--ok-dark);border-color:var(--ok-dark)}
button.ck svg{width:22px;height:22px}
.boss{display:flex;align-items:center;gap:14px;border-color:color-mix(in srgb,var(--bc) 45%,var(--line))}
.boss-art{flex:none;width:84px;height:84px}
.boss-art svg{display:block;width:100%;height:100%}
.boss-art.hit{animation:jolt .4s}
.boss.won .boss-art{filter:grayscale(1);opacity:.7}
.boss-r{flex:1;min-width:0}
.boss-r b{font-size:1.0625rem}
.bossbar{height:16px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);overflow:hidden;margin:6px 0 4px}
.bossbar i{display:block;height:100%;border-radius:99px;background:var(--bad);transition:width .6s cubic-bezier(.2,1.2,.3,1)}

/* FX */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.toasts{position:fixed;left:50%;bottom:calc(150px + var(--sab));transform:translateX(-50%);z-index:70;display:grid;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .3s cubic-bezier(.32,.72,0,1);transition:opacity .3s ease,transform .3s ease}
.toast.out{opacity:0;transform:translateY(8px)}
.toast.gold{background:var(--gold);color:#3A2800}
.coin{position:fixed;z-index:75;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF4B8,#FFBF1F 55%,#B87700);box-shadow:0 0 10px rgba(255,180,0,.75);pointer-events:none}
.float{position:fixed;z-index:76;pointer-events:none;font-weight:700;font-size:1.375rem;color:var(--grape);text-shadow:0 2px 0 rgba(0,0,0,.12);animation:floatUp 1.1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes floatUp{to{transform:translate(-50%,-70px);opacity:0}}
.praise{position:fixed;z-index:77;pointer-events:none;font-weight:700;font-size:2.125rem;color:var(--p);text-shadow:0 3px 0 rgba(0,0,0,.12);animation:praise 1.25s cubic-bezier(.2,1.4,.4,1) forwards;white-space:nowrap}
.praise.combo{color:var(--gold-dark);font-size:1.5rem}
.praise.lucky{color:var(--grape);font-size:2.375rem}
.praise.heart{color:#F43F5E;font-size:1.875rem}
@keyframes praise{0%{transform:translate(-50%,0) scale(.3) rotate(-10deg);opacity:0}25%{transform:translate(-50%,-22px) scale(1.15) rotate(3deg);opacity:1}70%{transform:translate(-50%,-36px) scale(1);opacity:1}100%{transform:translate(-50%,-62px) scale(.9);opacity:0}}
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(8,10,28,.86);overflow:hidden;cursor:pointer;animation:fade .25s}
.rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--oc) 30%,transparent) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ov-in{position:relative;text-align:center;color:#fff;padding:24px;max-width:420px}
.ov-k{font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--oc);animation:enter .5s both}
.ov-icon{width:120px;height:120px;margin:6px auto -6px;animation:slam .7s cubic-bezier(.2,1.5,.4,1) both}
.ov-icon svg{width:100%;height:100%}
.ov-num{font-weight:700;font-size:clamp(90px,26vw,160px);line-height:1;color:var(--oc);text-shadow:0 6px 0 rgba(0,0,0,.25);animation:slam .75s .1s cubic-bezier(.2,1.5,.4,1) both}
.ov-t{font-size:1.5rem;font-weight:700;animation:enter .5s .45s both}
.ov-s{opacity:.8;font-weight:500;margin-top:6px;animation:enter .5s .6s both}
.ov-week{display:flex;gap:8px;justify-content:center;margin-top:16px;animation:enter .5s .7s both}
.ov-week span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:0.75rem;font-weight:700;opacity:.85}
.ov-week i{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center}
.ov-week i.on{background:var(--oc)}
.ov-week i svg{width:16px;height:16px;color:#fff}
.overlay .btn{margin-top:24px;animation:enter .5s .8s both}
@keyframes slam{0%{transform:scale(3);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.unlock{position:fixed;top:12px;left:50%;z-index:72;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:20px;background:var(--card);border:3px solid var(--rc);box-shadow:0 14px 40px rgba(0,0,0,.3);width:min(420px,calc(100% - 24px));overflow:hidden;animation:drop .55s cubic-bezier(.2,1.5,.4,1) both}
.unlock b{font-size:1.0625rem}
.unlock .bdg{animation:spinIn .9s cubic-bezier(.2,1.4,.4,1) both;flex:none}
.unlock::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-100%);animation:sweep 1s .45s ease-out forwards;pointer-events:none}
.unlock.out{animation:dropOut .35s ease-in forwards}
@keyframes drop{from{transform:translate(-50%,-150%)}}
@keyframes dropOut{to{transform:translate(-50%,-160%);opacity:0}}
@keyframes spinIn{from{transform:rotateY(540deg) scale(.3)}}
.reward-orb{width:150px;height:150px;margin:8px auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--rc) 0%,color-mix(in srgb,var(--rc) 45%,transparent) 45%,transparent 70%);animation:orb .9s cubic-bezier(.2,1.6,.4,1) both}
.reward-orb b{font-size:2.5rem;font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}
@keyframes orb{from{transform:scale(0) rotate(-120deg)}}
.banner{margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--gold-soft);border:2px solid color-mix(in srgb,var(--gold) 45%,var(--line));font-weight:500;font-size:0.875rem}
.loading{padding:80px 0;text-align:center;color:var(--muted);font-weight:600}

/* Training, insights, time capsule */
input[type=search],input[type=date]{width:100%;min-height:48px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:500}
.linkcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-weight:500}
.tpl small{font-weight:400}
.gym-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-weight:600;font-size:.875rem;color:var(--muted)}
.gx{padding:12px}
.gx-h{display:flex;align-items:center;gap:8px}
.gx-name{flex:1;min-width:0;min-height:44px;text-align:left;display:grid;align-content:center}
.gx-name b{font-size:1.0625rem;line-height:1.2;overflow-wrap:anywhere;color:var(--p)}
.gx-name small{font-weight:500;font-size:.8125rem}
.gx-tip{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--gold-soft);font-size:.8125rem;font-weight:500}
.gx-tip svg{flex:none;width:18px;height:18px;color:color-mix(in srgb,var(--gold-dark) 60%,var(--ink))}
.gset{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px}
.gset-h{font-size:.75rem;font-weight:700;color:var(--muted);text-align:center;margin-top:10px}
.gset input{padding:10px 8px;text-align:center;font-weight:700;font-size:1.0625rem;min-height:48px}
.gset.done input{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.gs-n{display:grid;place-items:center;font-weight:700;color:var(--muted)}
.gs-n svg{width:20px;height:20px;color:color-mix(in srgb,var(--gold-dark) 70%,var(--ink))}
.gs-ck{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);transition:background-color .15s ease,transform .1s}
.gs-ck:active{transform:scale(.92)}
.gs-ck svg{width:24px;height:24px}
.gs-ck.on{background:var(--ok-dark);border-color:var(--ok-dark);color:#fff}
.gx-f{display:flex;gap:18px;margin-top:4px}
.restbar{position:fixed;z-index:58;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sab));width:min(448px,calc(100% - 24px));display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;border-radius:18px;background:var(--card);border:2px solid var(--p);box-shadow:0 10px 30px rgba(0,0,0,.22)}
.restbar[hidden]{display:none}
.restbar b{font-size:1.5rem;font-weight:700;min-width:3.2ch}
.restbar .muted{flex:1;font-weight:600;font-size:.875rem}
.rest-pad{height:70px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mtile{display:grid;gap:1px;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:.8125rem;font-weight:600}
.mtile b{font-size:.9375rem;overflow-wrap:anywhere}
.mtile span,.mtile small{color:var(--muted)}
.mtile.ready{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.mtile.ready span{color:color-mix(in srgb,var(--ok-dark) 75%,var(--ink))}
.mtile.rest{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.mtile.rest span{color:color-mix(in srgb,var(--gold-dark) 55%,var(--ink))}
.setline{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:8px 0;font-weight:600;border-bottom:1px solid var(--line)}
.setline:last-child{border-bottom:0}
.plates{display:flex;align-items:center;justify-content:center;gap:3px;height:110px;margin:10px 0}
.plates i{display:block;width:14px;border-radius:4px;background:var(--pb)}
.plates .barx{width:64px;height:10px;border-radius:3px;background:var(--muted)}
.quick{display:flex;gap:10px;margin-top:12px}
.qk{flex:1;min-width:0;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 6px;border-radius:18px;background:linear-gradient(135deg,var(--gold-soft),var(--p-soft));border:2px solid var(--gold);font-size:.8125rem}
.qk svg{width:30px;height:30px;color:color-mix(in srgb,var(--gold-dark) 60%,var(--ink))}
.qk b{font-weight:700;white-space:nowrap}
.qk.shake svg{animation:shake .45s ease-in-out 3}
.qk:active{transform:scale(.97)}
.insight{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-weight:500;font-size:.9375rem}
.insight svg{flex:none;width:20px;height:20px;color:var(--p);margin-top:2px}
.capsule{text-align:center}
.capsule .lock{width:52px;height:52px;margin:0 auto 6px;color:color-mix(in srgb,var(--gold-dark) 70%,var(--ink))}
.capsule .lock svg{width:100%;height:100%}
.captext{white-space:pre-wrap;text-align:left;font-weight:500;padding:12px;border-radius:14px;background:var(--gold-soft);overflow-wrap:anywhere}
/* ===== Design v4: flat surfaces over the older component styles above ===== */
.anim .enter{animation:enter .32s cubic-bezier(.32,.72,0,1) both;animation-delay:min(calc(var(--i,0) * 25ms),180ms)}
@keyframes enter{from{transform:translateY(6px);opacity:0}}
.week{margin-top:12px;padding:10px 6px;background:var(--card);border-radius:var(--r)}
.wday{font-weight:500}
.wbox span{font-weight:600}
.group-h{margin:24px 16px 6px;font-size:.8125rem;font-weight:500;letter-spacing:.02em;color:var(--muted)}
.hlist{display:block;background:var(--card);border-radius:var(--r);overflow:hidden}
.hcard{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 12px 10px 14px;background:none;border:0;border-radius:0;overflow:visible;transition:background-color .15s ease}
.hlist>.hcard+.hcard::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.hcard:active{background:var(--card-2);transform:none}
.hcard.done{background:none;border:0}
.hcard.done .hname{color:var(--muted)}
.hicon{width:36px;height:36px;border-radius:10px}
.hicon svg{width:20px;height:20px}
.hname{font-weight:500;font-size:1.0625rem}
.hmeta{gap:2px 10px;margin-top:2px;font-weight:400}
.hmeta .fl{font-weight:500}
.hwarn{font-weight:500;margin-top:3px}
.hcheck{width:44px;height:44px;background:none;color:color-mix(in srgb,var(--muted) 55%,transparent)}
.hcheck svg.ring{width:44px;height:44px}
.hcheck .t{stroke:var(--line)}
.hcheck .ck,.hcheck>svg:not(.ring){position:relative;width:22px;height:22px}
.hcheck>svg:not(.ring):not(.ck){color:var(--p)}
.hcheck .cnt{font-weight:600;font-size:.75rem}
.hcheck:not(:has(.ring)){box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 6.5px var(--line)}
.hcheck.done:not(:has(.ring)){box-shadow:none;background:radial-gradient(circle,var(--pb) 0 19px,transparent 19.5px)}
.hcheck.done{background:none;box-shadow:none;color:#fff}
.hcheck.done .t{stroke:color-mix(in srgb,var(--hc) var(--hk),#000);fill:color-mix(in srgb,var(--hc) var(--hk),#000)}
.hcheck.done .v{stroke:transparent}
.hcheck.pop::after{border-width:3px;inset:4px}
@keyframes ripple{to{inset:-10px;opacity:0}}
.hcard.shine::after{background:linear-gradient(110deg,transparent 35%,color-mix(in srgb,var(--hc) 18%,transparent) 50%,transparent 65%)}
.sos{min-height:32px;padding:4px 10px;border-radius:99px;border:0;font-weight:600;font-size:.75rem}
.off-list .hcard{opacity:.5}
.empty{padding:24px 18px}
.empty h2{font-size:1.25rem}

/* ============ Gruppen-Challenges ============ */
// The leader sets challenges on the server. Every member gets a local habit with h.gc = challenge id:
// name, kind, icon, color and days come from the leader, the member's checks go back via set_checks.
const GCERR = { not_leader: "Das darf nur der Leader der Gruppe.", bad_challenge: "Gib der Challenge einen Namen und wähle mindestens einen Tag.", too_many: "Höchstens 10 Challenges gleichzeitig.", not_found: "Diese Challenge gibt es nicht mehr." };

const isLeader = () => !!(grp.board && state.group && grp.board.leader === state.group.playerId);

const chOn = (c, k) => c.start_day <= k && (!c.end_day || k < c.end_day) && c.days.includes(wIdx(k));
const membersOn = k => grp.board.players.filter(p => !p.joined || p.joined <= k);
const daysTxt = ds => ds.length === 7 ? "täglich" : ds.map(d => WD[d]).join(", ");
// my own checks of today and yesterday come from this device, the server may not have them yet
function chDone(c, pid, k) {
  if (state.group && pid === state.group.playerId && k >= addDays(todayK(), -1)) { const h = state.habits.find(x => x.gc === c.id); if (h && h.start <= k) return isDone(h, k); }
  return !!grp.ck && grp.ck.has(c.id + "|" + pid + "|" + k);
}
function teamDay(k) { // all checks the group needs on day k, and how many it has
  let need = 0, got = 0; const ps = membersOn(k);
  (grp.board.challenges || []).filter(c => chOn(c, k)).forEach(c => ps.forEach(p => { need++; if (chDone(c, p.id, k)) got++; }));
  return { need, got };
}
// Team streak: days on which every member did every challenge. Days without a challenge are rest days.
function teamStreak() {
  const t = todayK(), td = teamDay(t); let n = 0, k = td.need && td.got >= td.need ? t : addDays(t, -1);
  for (let i = 0; i < 35; i++, k = addDays(k, -1)) { const d = teamDay(k); if (!d.need) continue; if (d.got < d.need) break; n++; } // shortcut: the board sends 5 weeks of checks, so the streak shows at most 35
  return n;
}
function chToday(pid) { const t = todayK(); let need = 0, got = 0; runningCh().filter(c => chOn(c, t)).forEach(c => { need++; if (chDone(c, pid, t)) got++; }); return { need, got }; }
function syncChallenges() {
  if (!grp.board || !grp.board.challenges) return false; // old server: leave everything as it is
  const run = runningCh(), t = todayK(), n = state.habits.length; let changed = false;
  run.forEach(c => {
    const f = { name: String(c.name).slice(0, 40), kind: c.kind === "break" ? "break" : "build", icon: HI[c.icon] ? c.icon : "heart", color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : COLORS[0], days: (c.days || []).filter(d => d >= 0 && d < 7), diff: 2, target: 1 };
    const h = state.habits.find(x => x.gc === c.id);
    if (!h) { state.habits.push(normHabit(Object.assign({ id: uid(), gc: c.id, start: t, quitStart: Date.now() }, f))); changed = true; toast(`Neue Gruppen-Challenge: „${f.name}“`, "gold"); }
    else if (Object.keys(f).some(k => JSON.stringify(h[k]) !== JSON.stringify(f[k]))) { Object.assign(h, f); changed = true; }
  });
  const ids = new Set(run.map(c => c.id));
  state.habits = state.habits.filter(h => !h.gc || ids.has(h.gc));

}
function dropChallenges() { state.habits = state.habits.filter(h => !h.gc); gLastChecks = ""; }
async function pushChecks() {

  const t = todayK(), y = addDays(t, -1);
  const list = state.habits.filter(h => h.gc).flatMap(h => [y, t].filter(k => sched(h, k)).map(k => ({ c: h.gc, d: k, v: isDone(h, k) }))).slice(0, 40), j = JSON.stringify(list);

  catch (e) { if (/could not find the function/i.test(e.message || "")) { grp.old = true; return; } throw e; }
}
// Once a day: when the whole group has done every challenge, each member gets a bonus.
function teamBonus() {
  if (!grp.board || !grp.board.challenges || grp.board.players.length < 2) return;
  const t = todayK(), d = teamDay(t), dd = day(t);
  if (!d.need || d.got < d.need || dd.team) return;
  dd.team = true; addXP(25, t); addCoins(10); evaluateBadges(); save(); renderTopbar();

}
const avatarSm = p => `<i class="mav" style="--av:${esc(p.color || "#FF8A3D")}">${esc((p.name || "?").charAt(0).toUpperCase())}</i>`;
function gcBadge(h) { // who in the group has it done today, on the habit row
  if (!h.gc || !grp.board || !grp.board.challenges) return "";
  const c = runningCh().find(x => x.id === h.gc), t = todayK(); if (!c || !chOn(c, t)) return "";
  const ps = membersOn(t), dn = ps.filter(p => chDone(c, p.id, t));
  return `<span class="mavs" aria-label="${dn.length} von ${ps.length} in der Gruppe geschafft">${dn.slice(0, 4).map(avatarSm).join("")}<b class="num">${dn.length}/${ps.length}</b></span>`;
}
function ranking(all) { // the leaderboard, with my own values from this device

function reminderPlan() { // reminders for the next 7 days, at most 60 (iOS keeps 64 pending)

    });

// Square crop, 256 px JPEG: small enough for the local save and the backup file.
function setAvatar(file) {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const S = 256, c = document.createElement("canvas"), k = Math.max(S / img.width, S / img.height), w = img.width * k, h = img.height * k;
    c.width = c.height = S; c.getContext("2d").drawImage(img, (S - w) / 2, (S - h) / 2, w, h); URL.revokeObjectURL(url);
    state.profile.avatar = c.toDataURL("image/jpeg", .82); save(); render(); toast("Profilbild gespeichert");
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Das Bild konnte nicht geöffnet werden"); };
  img.src = url;
}

/* ============ Messarten (Ziele je Gewohnheit) ============ */
// h.mode: "" (alt: Abhaken oder Menge je nach Ziel), count (Menge mit Schnell-Buttons), timer (Minuten mit Timer),

// h.log[Tag] ist immer die Menge des Tages (Minuten, Schritte, ml …); erledigt = log >= target. Wake und Journal haben target 1.

const fmtN = n => Math.round(n).toLocaleString(LOC());
const fmtK = n => n < 1000 ? String(Math.round(n)) : n < 10000 ? (Math.floor(n / 100) / 10).toLocaleString(LOC()) + "k" : Math.floor(n / 1000) + "k";
const fmtClock = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s >= 3600 ? `${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}` : `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const defQuick = u => u === "ml" ? [250, 500] : u === "Seiten" ? [1, 5, 10] : u === "km" ? [1] : [1];
const quickOf = h => h.quick && h.quick.length ? h.quick : defQuick(h.unit);
const parseQuick = (txt, unit) => { const q = String(txt || "").split(/[,;\s]+/).map(Number).filter(n => n > 0 && n <= 100000).map(Math.round).slice(0, 4); return q.length ? q : defQuick(unit); };
const wc = s => (String(s || "").trim().match(/\S+/g) || []).length;
const jWordsToday = h => state.journal.filter(e => e.habitId === h.id && e.day === todayK()).reduce((a, e) => a + wc(e.text), 0);
const hmToMin = hm => { const [H, M] = String(hm || "06:30").split(":").map(Number); return H * 60 + M; };
const minToHm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const wakeLimit = h => minToHm(hmToMin(h.wakeAt) + (h.grace || 0));
const platform = () => window.Capacitor && window.Capacitor.getPlatform ? window.Capacitor.getPlatform() : "web";
const centerRect = () => ({ left: innerWidth / 2 - 29, top: innerHeight / 2 - 29, width: 58, height: 58 });
function modeMeta(h, c) {

}

// Sets today's amount and runs the right feedback: completion, undo or a small tick.
function setProgress(h, v, r, quiet) {
  const t = todayK();
  if (!sched(h, t)) { toast("Heute ist für diese Gewohnheit frei."); return; }
  if (h.slip === t) { toast("Heute gab es einen Rückfall. Morgen zählt wieder ein neuer Tag."); return; }
  const was = isDone(h, t), prev = cnt(h, t); v = Math.max(0, Math.round(v));
  if (v) h.log[t] = v; else delete h.log[t];
  const now = isDone(h, t); r = r || centerRect();
  const bx = r.left + r.width / 2, by = r.top + r.height / 2;

  if (was && !now) { const x = h.xp[t] || 0; delete h.xp[t]; addXP(-x, t); addCoins(-Math.round(x / 2)); unperfect(t); sfx("undo"); save(); render(); return; }

function undoToday(h) {

}

  setProgress(h, cnt(h, t) + add, r);

/* ---- Timer (Lesen, Meditieren, Aufräumen …) ---- */
// state.timer = { id, run: Startzeit oder 0 (pausiert), acc: bisher gelaufene ms }. Übersteht Neuladen und läuft weiter, wenn die App zu ist.
const tmMs = () => { const T = state.timer; return T ? T.acc + (T.run ? Date.now() - T.run : 0) : 0; };
const tmLeft = h => Math.max(0, h.target * 60000 - cnt(h, todayK()) * 60000 - tmMs());
const tmSub = h => `Heute ${cnt(h, todayK())} von ${h.target} Min · Sitzung ${fmtClock(tmMs())}`;
function openTimer(h) {
  const T = state.timer;
  if (T && T.id !== h.id) { const o = state.habits.find(x => x.id === T.id); if (o) { toast(`Erst den Timer für „${o.name}“ beenden.`); h = o; } else state.timer = null; }
  if (isDone(h, todayK()) && !state.timer) { openDetail(h.id); return; }
  if (!state.timer) state.timer = { id: h.id, run: 0, acc: 0 };
  drawTimer();
}
function drawTimer() {
  const T = state.timer; if (!T) return;
  const h = state.habits.find(x => x.id === T.id); if (!h) { state.timer = null; return; }
  const R = 96, C = 2 * Math.PI * R, frac = Math.min(1, (cnt(h, todayK()) * 60000 + tmMs()) / (h.target * 60000));
  openSheet(`${sheetHead(h.name)}
    <div class="tm" style="--hc:${esc(h.color)}">
      <div class="tm-ring ${T.run ? "run" : ""}"><svg viewBox="0 0 220 220" aria-hidden="true"><circle class="t" cx="110" cy="110" r="${R}"/><circle class="v" id="tmRing" cx="110" cy="110" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg>
        <div class="tm-in"><div class="muted" style="font-size:.8125rem;font-weight:600">${T.run ? "Noch" : T.acc ? "Pausiert · noch" : "Tagesziel"}</div><div class="tm-time num" id="tmTime" role="timer" aria-live="off">${fmtClock(tmLeft(h))}</div><div class="muted num" id="tmSub" style="font-size:.8125rem">${tmSub(h)}</div></div></div>
      <div class="tm-btns">
        <button class="btn" data-action="tm-toggle" style="min-width:140px">${T.run ? `${I.pause} Pause` : `${I.play} ${T.acc ? "Weiter" : "Start"}`}</button>
        <button class="btn ghost" data-action="tm-stop" ${tmMs() < 30000 ? "disabled" : ""}>${I.check} Speichern</button>
      </div>
      <p class="muted" style="text-align:center;font-size:.8125rem;margin:0">Der Timer läuft weiter, auch wenn du das Fenster oder die App schließt. Am Ziel ertönt ein Gong.</p>
      <div class="row2" style="grid-template-columns:1fr auto;align-items:end"><div class="field" style="margin:0"><label for="amtIn">Minuten nachtragen</label><input type="number" id="amtIn" min="1" max="600" inputmode="numeric" placeholder="z. B. 10"></div><button class="btn sm ghost" data-action="amt-add" data-id="${h.id}" style="height:48px">Nachtragen</button></div>
      ${T.acc || T.run ? `<button class="link" data-action="tm-discard">Sitzung verwerfen</button>` : ""}
    </div>`);
}
function tmToggle() {
  const T = state.timer; if (!T) return;
  if (T.run) { T.acc += Date.now() - T.run; T.run = 0; sfx("undo"); }
  else { T.run = Date.now(); sfx("open"); vibrate(20); }
  save(); drawTimer(); render();
}
function tmFinish(auto) {

}
function tmTick() {

  if (tmLeft(h) <= 0) { tmFinish(true); return; }
  const el = $("#tmTime"); if (el) { el.textContent = fmtClock(tmLeft(h)); $("#tmSub").textContent = tmSub(h); const ring = $("#tmRing"); if (ring) { const C = 2 * Math.PI * 96; ring.style.strokeDashoffset = C * (1 - Math.min(1, (cnt(h, todayK()) * 60000 + tmMs()) / (h.target * 60000))); } }
  $$("[data-timer]").forEach(x => { x.textContent = fmtClock(tmMs()); });

}
setInterval(tmTick, 500);

/* ---- Aufstehen ---- */
function wakeCheck(h, btn) {

  h.woke = h.woke || {}; h.woke[t] = minToHm(mins);
  if (mins <= hmToMin(h.wakeAt) + (h.grace || 0)) {
    const r = btn ? btn.getBoundingClientRect() : centerRect();
    setProgress(h, 1, r);
    setTimeout(() => praise(r.left + r.width / 2, r.top + 30, mins <= hmToMin(h.wakeAt) ? "Pünktlich!" : "Gerade noch!", "combo"), 350);
  } else {
    save(); render();

  }
}

// Android: echter Wecker in der Uhr-App (Plugin DaysWidget.setAlarm). Wochentage für AlarmClock: So=1 … Sa=7.
async function setPhoneAlarm(h, silent) {
  const [H, M] = h.wakeAt.split(":").map(Number), A = capP("DaysAlarm");
  if (A && platform() === "ios") {
    try {
      const r = await A.set({ id: h.alarmId || "", hour: H, minute: M, days: h.days, label: h.name });
      h.alarmId = r.id; h.alarmSet = `${h.wakeAt}|${h.days.join("")}`; save();
      if (!silent) toast(`Wecker für ${h.wakeAt} gestellt. Er klingelt auch im Lautlos-Modus.`);
      return true;
    } catch (e) { if (!silent) toast(e && e.code === "denied" ? "Ohne Erlaubnis kann 21 Days keinen Wecker stellen. Erlauben unter Einstellungen → 21 Days." : "Der echte Wecker braucht iOS 26 oder neuer."); return false; }
  }
  const W = capP("DaysWidget");
  if (!W || platform() !== "android") return false;
  try {
    await W.setAlarm({ hour: H, minute: M, days: h.days.map(d => d === 6 ? 1 : d + 2), label: `21 Days: ${h.name}` });
    h.alarmSet = `${h.wakeAt}|${h.days.join("")}`; save();
    if (!silent) toast(`Wecker für ${h.wakeAt} in der Uhr-App gestellt.`);
    return true;
  } catch (e) { if (!silent) toast("Es wurde keine Uhr-App gefunden, die Wecker annimmt."); return false; }
}
function wakeIcs(h) {
  const [H, M] = h.wakeAt.split(":"), by = h.days.map(d => ["MO", "TU", "WE", "TH", "FR", "SA", "SU"][d]).join(",");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//21 Days//DE", "BEGIN:VEVENT", `UID:${h.id}-wake@21days`, `DTSTAMP:${stamp}`, `DTSTART:${todayK().replace(/-/g, "")}T${H}${M}00`, "DURATION:PT5M",
    `RRULE:FREQ=WEEKLY;BYDAY=${by}`, `SUMMARY:${h.name.replace(/[,;\\]/g, " ")} (21 Days)`, "DESCRIPTION:Aufstehen! In 21 Days auf Ich bin wach tippen.", "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Aufstehen!", "TRIGGER:PT0M", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" })); a.download = "21days-wecker.ics"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Kalender-Datei geladen. Öffnen und in den Kalender übernehmen.");
}

/* ---- Handyzeit ---- */
// h.scr[Tag] = Minuten Bildschirmzeit, h.limit = Tageslimit. Geschafft (log 1) ab 20 Uhr, wenn der Wert unter dem Limit liegt; drüber nimmt den Haken zurück.
const SCREEN_HOUR = 20;
function setScreen(h, min, quiet) {
  const t = todayK(); h.scr = h.scr || {}; h.scr[t] = Math.max(0, Math.round(min));
  const ok = h.scr[t] <= h.limit, late = new Date().getHours() >= SCREEN_HOUR;
  if (!ok && isDone(h, t)) { setProgress(h, 0, null, true); if (!quiet) toast(`Limit überschritten: ${h.scr[t]} von ${h.limit} Min.`); return; }
  if (ok && late && !isDone(h, t) && sched(h, t)) { setProgress(h, 1, null); return; }
  save(); render();
  if (!quiet) toast(ok ? (late ? "Gespeichert" : `Noch ${h.limit - h.scr[t]} Min übrig. Ab ${SCREEN_HOUR} Uhr zählt der Tag.`) : `Über dem Limit: ${h.scr[t]} von ${h.limit} Min.`);
}
async function screenRead(silent) {
  const W = capP("DaysWidget"), t = todayK(), hs = state.habits.filter(h => modeOf(h) === "screen" && sched(h, t));
  if (!hs.length || !W || platform() !== "android") return null;
  try {
    const r = await W.usage();
    if (!r.granted) { if (!silent) { toast("Erlaube 21 Days den Nutzungszugriff, dann liest die App deine Bildschirmzeit."); W.openUsageSettings().catch(() => {}); } return null; }
    hs.forEach(h => setScreen(h, r.minutes, true)); return r.minutes;
  } catch (e) { return null; }
}
function openScreen(h) {
  const t = todayK(), u = (h.scr || {})[t], over = u != null && u > h.limit, auto = platform() === "android" && capP("DaysWidget");
  openSheet(`${sheetHead(h.name)}
    <div class="card" style="--hc:${esc(h.color)}"><b>Heute</b><div class="big-num num" style="${over ? "color:var(--bad)" : ""}">${u == null ? "–" : u} <small>/ ${h.limit} Min</small></div>
      <div class="mode-bar"><i style="width:${u == null ? 0 : Math.min(100, u / h.limit * 100)}%;${over ? "background:var(--bad)" : ""}"></i></div>
      <p class="muted" style="margin:10px 0 0">${u == null ? "Noch nichts eingetragen." : over ? `${u - h.limit} Min über dem Limit.` : `Noch ${h.limit - u} Min im Limit.`} Ab ${SCREEN_HOUR} Uhr zählt der Tag als geschafft, wenn du unter dem Limit bleibst.</p>
      ${auto ? `<div class="qbtns"><button class="btn sm" data-action="scr-read" data-id="${h.id}">${HI.phone} Bildschirmzeit lesen</button></div>` : ""}
      <div class="row2" style="grid-template-columns:1fr auto;align-items:end;margin-top:12px"><div class="field" style="margin:0"><label for="scrIn">Minuten heute</label><input type="number" id="scrIn" min="0" max="1440" inputmode="numeric" placeholder="${u == null ? "z. B. 95" : u}"></div><button class="btn sm ghost" data-action="scr-set" data-id="${h.id}" style="height:48px">Eintragen</button></div>

}

/* ---- Schritte ---- */
// Quellen: Apple Health / Health Connect (Plugin "Health", nur in der App), Kurzbefehl-Link days21://steps/ZAHL bzw. #steps=ZAHL, Eingabe.
function stepsFromUrl(n) {
  const t = todayK(), hs = state.habits.filter(x => modeOf(x) === "steps" && sched(x, t));
  if (!hs.length) { toast("Leg zuerst eine Gewohnheit „10.000 Schritte“ an."); return; }
  if (view !== "heute") location.hash = "heute";
  setTimeout(() => { hs.forEach(h => { if (n > cnt(h, t)) setProgress(h, n, null, true); }); toast(`${fmtN(n)} Schritte übernommen`); }, 300);
}
let healthBusy = false;
async function healthSync(ask) {
  const H = capP("Health"), t = todayK(), hs = state.habits.filter(h => modeOf(h) === "steps" && h.health && sched(h, t));
  if (!H) { if (ask) toast("Das geht nur in der 21-Days-App auf dem Handy."); return; }
  if (!hs.length || healthBusy) return;
  if (!ask && !state.flags.healthAsked) return; // nie ungefragt nach der Erlaubnis fragen
  healthBusy = true;
  try {
    const av = await H.isAvailable();
    if (!av || !av.available) { if (ask) toast(platform() === "android" ? "Health Connect fehlt. Installiere es aus dem Play Store." : "Apple Health ist auf diesem Gerät nicht verfügbar."); return; }
    if (ask) { await H.requestAuthorization({ read: ["steps"], write: [] }); state.flags.healthAsked = true; }
    const s = parseK(t);
    const r = await H.queryAggregated({ dataType: "steps", startDate: s.toISOString(), endDate: new Date().toISOString(), bucket: "day", aggregation: "sum" });
    const n = Math.round(((r && r.samples) || []).reduce((a, x) => a + (Number(x.value) || 0), 0));
    hs.forEach(h => { if (n > cnt(h, t)) setProgress(h, n, null, true); });
    if (ask) toast(n ? `${fmtN(n)} Schritte von heute übernommen` : "Noch keine Schritte gefunden. Prüfe in den Health-Einstellungen, ob 21 Days lesen darf.");
  } catch (e) { if (ask) toast("Schritte konnten nicht gelesen werden. Prüfe die Health-Berechtigung."); }
  finally { healthBusy = false; }
}

// Ändert sich Messart oder Ziel einer bestehenden Gewohnheit, bleiben erledigte Tage erledigt (Serie bleibt).
function rescaleLog(old, nh) {
  if (old.target === nh.target && modeOf(old) === modeOf(nh)) return;
  Object.keys(nh.log).forEach(k => { const was = (old.log[k] || 0) >= old.target; if (was) nh.log[k] = nh.target; else { const v = Math.min(old.log[k] || 0, nh.target - 1); if (v > 0) nh.log[k] = v; else delete nh.log[k]; } });
}

function syncTodo() { $$("#tForm [data-t]").forEach(el => { tdraft[el.dataset.t] = el.value; }); }

function ckAdd() {

// Checklist XP is settled against the saved todo, so ticking, unticking and deleting items always balance out.
function saveTodo(silent) {
  syncTodo(); const name = (tdraft.name || "").trim();
  if (!name) { const er = $("#tErr"); if (er) er.textContent = "Gib der Aufgabe einen Titel."; const n = $("#tName"); if (n) n.focus(); return false; }
  tdraft.name = name; tdraft.diff = clamp(Number(tdraft.diff) || 2, 1, 3);
  const prev = tdraft.id ? state.todos.find(x => x.id === tdraft.id) : null, was = new Map((prev ? prev.checklist : []).map(c => [c.id, c.done]));
  let xp = 0;
  tdraft.checklist.forEach(c => { if (c.done && !was.get(c.id)) xp += CK_XP; if (!c.done && was.get(c.id)) xp -= CK_XP; });
  if (prev) prev.checklist.forEach(c => { if (c.done && !tdraft.checklist.some(q => q.id === c.id)) xp -= CK_XP; });
  const copy = JSON.parse(JSON.stringify(tdraft));
