  if (xp) { addXP(xp); addCoins(Math.round(xp / 2)); }
  evaluateBadges(); save(); if (!silent) toast("Aufgabe gespeichert");
  return true;
}
function tapTodo(id, btn) {
  const t = state.todos.find(x => x.id === id); if (!t) return;
  const r = btn.getBoundingClientRect(), bx = r.left + r.width / 2, by = r.top + r.height / 2, today = todayK();
  if (t.done) { const x = t.xp || 0; t.done = false; t.doneAt = ""; t.xp = 0; addXP(-x); addCoins(-Math.round(x / 2)); state.flags.todos = Math.max(0, (state.flags.todos || 0) - 1); sfx("undo"); save(); render(); return; }

  const lucky = hash01(t.id + today) < .12; if (lucky) xp *= 2;
  t.done = true; t.doneAt = today; t.xp = xp; addXP(xp); addCoins(Math.round(xp / 2)); state.flags.todos = (state.flags.todos || 0) + 1;
  burst(bx, by, lucky ? 130 : 80, lucky ? 1.35 : 1); floatText(bx, r.top - 8, `+${xp} XP`); flyCoins(bx, by, Math.min(12, 3 + Math.round(xp / 6)));
  praise(bx, r.top - 30, lucky ? "Glückstreffer!" : pick(["Erledigt!", "Abgehakt!", "Geschafft!"], t.id), lucky ? "lucky" : ""); sfx(lucky ? "bonus" : "check"); vibrate([25, 30, 45]);
  evaluateBadges(); save(); render();

}

/* ============ Erkenntnisse, Wochenrückblick, Zeitkapsel ============ */
// Patterns from the person's own data, computed on the device.
const WDL = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
function insights() {
  const t = todayK(), out = [], pc = v => Math.round(v * 100) + " %", f1 = v => v.toFixed(1).replace(".", ",");
  const wd = WD.map(() => [0, 0]);
  for (let i = 1; i <= 56; i++) { const k = addDays(t, -i); habitsFor(k).forEach(h => { wd[wIdx(k)][0]++; if (isDone(h, k)) wd[wIdx(k)][1]++; }); }
  const rs = wd.map(([p, d], i) => ({ i, p, r: p ? d / p : 0 })).filter(x => x.p >= 3).sort((a, b) => b.r - a.r);
  if (rs.length >= 3 && rs[0].r - rs[rs.length - 1].r >= .15) out.push(`${WDL[rs[0].i]} ist dein stärkster Tag (${pc(rs[0].r)}). Am ${WDL[rs[rs.length - 1].i]} fällt es dir am schwersten (${pc(rs[rs.length - 1].r)}).`);
  const hr = state.habits.map(h => { let p = 0, d = 0; for (let i = 1; i <= 14; i++) { const k = addDays(t, -i); if (sched(h, k)) { p++; if (isDone(h, k)) d++; } } return { h, p, r: p ? d / p : 1 }; }).filter(x => x.p >= 4).sort((a, b) => a.r - b.r);
  if (hr.length && hr[0].r < .6) out.push(`„${hr[0].h.name}“ wackelt: ${pc(hr[0].r)} in den letzten 2 Wochen. Mach die Gewohnheit kleiner oder häng sie an einen festen Auslöser.`);
  if (hr.length > 1 && hr[hr.length - 1].r >= .85) out.push(`„${hr[hr.length - 1].h.name}“ sitzt: ${pc(hr[hr.length - 1].r)} in den letzten 2 Wochen.`);
  const a = [[0, 0], [0, 0]], g = [[0, 0], [0, 0]];
  Object.entries(state.pledges).forEach(([k, p]) => {
    if (!p.pm || !p.pm.mood) return;
    const hs = habitsFor(k); if (hs.length) { const i = hs.filter(h => isDone(h, k)).length / hs.length >= .8 ? 0 : 1; a[i][0] += p.pm.mood; a[i][1]++; }
    const j = state.gym.sessions.some(s => s.day === k) ? 0 : 1; g[j][0] += p.pm.mood; g[j][1]++;
  });
  const avg = x => x[0] / x[1];
  if (a[0][1] >= 3 && a[1][1] >= 3 && avg(a[0]) - avg(a[1]) >= .3) out.push(`An starken Tagen geht es dir besser: Stimmung ${f1(avg(a[0]))} statt ${f1(avg(a[1]))} von 5.`);
  if (g[0][1] >= 3 && g[1][1] >= 3 && avg(g[0]) - avg(g[1]) >= .3) out.push(`Training hebt deine Laune: ${f1(avg(g[0]))} an Trainingstagen, sonst ${f1(avg(g[1]))} von 5.`);
  return out.slice(0, 4);
}

// Weekly recap: a short run of full-screen cards about the week before the current one
const recapWeek = () => addDays(weekStart(todayK()), -7);

  const best = [...per.entries()].filter(([, o]) => o[0] >= 2 && o[1] > 0).sort((x, y) => y[1][1] / y[1][0] - x[1][1] / x[1][0] || y[1][1] - x[1][1])[0] || null;
  const gs = state.gym.sessions.filter(s => s.day >= ws && s.day < end);
  return { p, d, perfect, best, xp: weekXp(ws), gs, vol: gs.reduce((a, s) => a + s.vol, 0), prs: gs.reduce((a, s) => a + s.prs, 0), words: Object.values(state.vocab.got).filter(x => x >= ws && x < end).length, jr: state.journal.filter(e => e.day >= ws && e.day < end).length };
}

        const d = draftFrom(null, tpl, kind); d.id = uid(); d.start = todayK(); d.quitStart = Date.now();
        state.habits.push(normHabit(d)); save(); sfx("bonus"); burst(innerWidth / 2, innerHeight * .5, 60);
        ob.step = 4; drawOb();
      }); break;
    }
    case "ob-custom": openEditor(draftFrom(null, null, "build")); break;
    case "ob-finish": {
      state.profile.onboarded = true; if (!state.flags.welcome) { state.flags.welcome = true; addCoins(50); }
      save(); closeSheet(); location.hash = "heute"; animateNext = true; render(); bigCelebration(); sfx("bonus");
      setTimeout(() => flyCoins(innerWidth / 2, innerHeight / 2, 12), 300); setTimeout(startTour, 1600); break;
    }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const ov = $(".overlay"); if (ov) { ov.click(); return; } if ($('.back[data-back="1"]')) closeSheet(); }
  if (e.key === "Enter" && e.target.id === "rwName") { e.preventDefault(); $('[data-action="add-reward"]').click(); }
});
document.addEventListener("submit", e => e.preventDefault());
function restoreFrom(text) {
  try { const data = JSON.parse(text); if (!data || !Array.isArray(data.habits)) throw new Error("bad"); state = migrate(data); shownXp = null; curAct = { a: "restore", t: Date.now() }; save(); closeSheet(); render(); toast("Backup wiederhergestellt", "gold"); }
  catch (err) { const el = $("#bkErr"); if (el) el.textContent = "Das ist kein gültiges 21-Days-Backup."; }
}
document.addEventListener("change", e => {
  if (e.target.id !== "restoreFile" || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => restoreFrom(fr.result);
  fr.readAsText(e.target.files[0]);
});

document.addEventListener("input", e => {
  if (e.target.id !== "jText" || !jdraft) return;
  jdraft.text = e.target.value; const old = $("#jWords"); if (old) old.outerHTML = jWordsHTML();
});

/* ============ Tickers ============ */
function updateTickers() {
  const now = Date.now();
  $$("[data-since]").forEach(el => { el.textContent = fmtSince(now - Number(el.dataset.since)); });
  $$("[data-money]").forEach(el => { const h = state.habits.find(x => x.id === el.dataset.money); if (h) el.textContent = eur(h.money * quitDays(h)); });
}
setInterval(updateTickers, 1000);
function checkQuitMilestones(silent) {
  let best = null;
  state.habits.forEach(h => {
    if (h.kind !== "break") return;
    const qd = quitDays(h);
    QUIT_MS.forEach(m => { if (qd >= m && !h.quitHit.includes(m)) { h.quitHit.push(m); addCoins(10 + m); if (!best || m > best.m) best = { m, h }; } });
  });
  if (best && !silent) pushOverlay({ kicker: "Durchgehalten", big: String(best.m), title: `${best.m === 1 ? "Tag" : "Tage"} frei: ${best.h.name}`, sub: best.h.money ? `Schon ${eur(best.h.money * quitDays(best.h))} gespart!` : "Jeder Tag macht dich stärker.", color: "#1FBF8A" });
  if (best) { evaluateBadges(); save(); }
}
let lastDay = todayK();
// Runs on the timer and when the app comes back to the front, so a new day never shows yesterday's state.
function dayTick() { if (todayK() === lastDay) return false; lastDay = todayK(); const fr = applyFreezes(); if (fr) freezeNotice(fr); save(); syncGroup(); return true; }
setInterval(() => {
  if (dayTick()) render();
  if (state.profile.onboarded) checkQuitMilestones(false);
}, 30000);
function freezeNotice(fr) {
  if (fr.saved) setTimeout(() => pushOverlay({ kicker: "Serie gerettet", icon: I.shield, big: String(fr.streak), title: `${fr.saved === 1 ? "Ein Schutzschild hat" : fr.saved + " Schutzschilde haben"} deine Serie gerettet!`, sub: "Hol dir heute ein Häkchen, damit sie weiterwächst.", color: "#38B6F5", sound: "unlock" }), 600);
  else if (fr.lost) setTimeout(() => toast(`Deine ${fr.lost}-Tage-Serie ist vorbei. Heute startet eine neue!`), 800);
}

/* ============ Routing & boot ============ */
const VIEWS = ["heute", "abgewoehnen", "todos", "fortschritt", "begleiter", "gruppe", "profil"];
function route() { if (location.hash.startsWith("#join=")) { handleJoinUrl(location.hash); return; }
  if (/^#(wake|steps=\d+)$/.test(location.hash)) { const hh = location.hash; history.replaceState(null, "", "#heute"); view = "heute"; render(); handleAppUrl(hh); return; } const h = location.hash.slice(1); view = VIEWS.includes(h) ? h : "heute"; animateNext = true; if (store.mode !== "loading") render(); window.scrollTo(0, 0); }
addEventListener("hashchange", route);

function afterLoad() {
  snap = takeSnap();
  const h = location.hash.slice(1); view = VIEWS.includes(h) ? h : "heute";
  const fr = state.profile.onboarded ? applyFreezes() : null;
  animateNext = true; render();
  if (!state.profile.onboarded) { openOnboarding(); return; }
  if (fr) freezeNotice(fr);
  checkQuitMilestones(false);
  evaluateBadges(); save(); syncGroup();
  if (location.hash.startsWith("#join=")) handleJoinUrl(location.hash);
  if (/^#(wake|steps=\d+)$/.test(location.hash)) { const hh = location.hash; history.replaceState(null, "", "#heute"); view = "heute"; render(); handleAppUrl(hh); }
  if (state.timer) tmTick();
  setTimeout(() => healthSync(false), 1200);
}
function loadCached() {
  try { const v2 = localStorage.getItem(KEY); if (v2) return JSON.parse(v2); const v1 = localStorage.getItem(OLD_KEY); if (v1) return JSON.parse(v1); } catch (e) { /* ignore */ }
  return null;
}
function startLocal(cached, notice) {
  if (store.mode !== "loading") return;
  store.mode = "local"; store.notice = notice || ""; state = cached ? migrate(cached) : freshState(); afterLoad();
}
function init() {
  render();
  startLocal(loadCached(), "");
  deviceSync(); screenRead(true);
}
let installEvt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (view === "profil") render(); });
addEventListener("appinstalled", () => { installEvt = null; toast("21 Days ist installiert!", "gold"); });
const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (CapApp) CapApp.addListener("backButton", ({ canGoBack }) => {
  const ov = $(".overlay"); if (ov) { ov.click(); return; }
  if (pk) { closePack(false); return; }
  if (game) { endGame(true); return; }
  const bk = $('#modalRoot .back:not(.closing) [data-action="gy-back"]'); if (bk) { bk.click(); return; } // workout screens step back instead of closing
  if ($("#wk")) { $('[data-action="gy-min"]').click(); return; }
  const layer = $("#modalRoot .back"); if (layer) { if (layer.dataset.back === "1") closeSheet(); return; }
  if (canGoBack) history.back(); else CapApp.exitApp();
});
if (CapApp) { // invite links that open the app: days21://join/CODE
  CapApp.addListener("appUrlOpen", e => handleAppUrl(e.url));
  CapApp.getLaunchUrl().then(r => { if (r && r.url) handleAppUrl(r.url); }).catch(() => {});
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if ($("#wk")) wake(true); // the browser drops the wake lock whenever the app is hidden
  dayTick(); syncGroup(); deviceSync(); screenRead(true); if (view === "gruppe" || view === "heute") loadBoard();
  if (state.timer) tmTick(); healthSync(false);
  if (!$(".back") && !$(".overlay")) render();
});
const LNtap = capP("LocalNotifications");
if (LNtap) LNtap.addListener("localNotificationActionPerformed", a => {
  const x = (a && a.notification && a.notification.extra) || {};
  if (x.act === "wake") setTimeout(wakeFromUrl, 500);
  if (x.act === "timer") setTimeout(() => { if (state.timer) drawTimer(); }, 500);
});
const inApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if (!inApp && "serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
init();
})();
</script>
</body>
