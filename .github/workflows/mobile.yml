name: Android-APK und iPhone-IPA

# Von Hand starten: GitHub → Reiter „Actions“ → „Android-APK und iPhone-IPA“ → „Run workflow“.
# Ergebnis (nach ein paar Minuten unter „Artifacts“):
#   21Days-apk  → 21Days.apk  (direkt auf Android installieren)
#   21Days-ipa  → 21Days.ipa  (ungesigniert, mit Sideloadly oder AltStore und deiner Apple-ID aufs iPhone)
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Weboberfläche zusammenbauen
        run: node scripts/build-web.mjs

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Hochformat, Links (days21://join, wake, steps) und Wecker-Berechtigung festlegen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's/<activity\b/<activity android:screenOrientation="portrait"/' "$M"
          perl -0pi -e 's#</activity>#<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="days21"/></intent-filter></activity>#' "$M"
          perl -0pi -e 's#<application#<uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>\n    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"/>\n    <application#' "$M"
          grep -c 'PACKAGE_USAGE_STATS' "$M"
          grep -c 'days21' "$M"
          grep -c 'SET_ALARM' "$M"

      - name: Health Connect braucht Android 8 (minSdk 26)
        run: |
          perl -pi -e 's/minSdkVersion = \d+/minSdkVersion = 26/' android/variables.gradle
          grep 'minSdkVersion' android/variables.gradle

      - name: Startbildschirm-Widget einbauen (native/android)
        run: |
          cp -r native/android/java/. android/app/src/main/java/
          cp -r native/android/res/. android/app/src/main/res/
          M=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's#</application>#<receiver android:name=".TodayWidget" android:exported="false"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="\@xml/widget_today_info"/></receiver></application>#' "$M"
          grep -c 'TodayWidget' "$M"
          grep -c 'registerPlugin(WidgetPlugin' android/app/src/main/java/de/bambuseleitung/days21/MainActivity.java

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 21Days.apk && ls -lh 21Days.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 21Days-apk
          path: 21Days.apk
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Weboberfläche zusammenbauen
        run: node scripts/build-web.mjs

      - name: iOS-Projekt erzeugen
        run: |
          npx cap add ios
          npx @capacitor/assets generate --ios
          npx cap sync ios

      - name: Hochformat und Einladungs-Link (days21://) festlegen
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$P"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string de.bambuseleitung.days21" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string days21" "$P"

      - name: Apple Health (Schritte lesen)
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSHealthShareUsageDescription" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSHealthShareUsageDescription string 21 Days liest deine Schritte, um die Gewohnheit Schritte automatisch abzuhaken. Die Daten bleiben auf deinem iPhone." "$P"
          /usr/libexec/PlistBuddy -c "Delete :NSHealthUpdateUsageDescription" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSHealthUpdateUsageDescription string 21 Days schreibt nichts in Apple Health." "$P"
          cat > "$RUNNER_TEMP/App.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.developer.healthkit</key><true/><key>com.apple.developer.healthkit.access</key><array/></dict></plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/App.entitlements"

      - name: Echter Wecker (AlarmKit, native/ios) einbauen
        run: |
          cp native/ios/*.swift ios/App/App/
          sudo gem install xcodeproj --no-document
          ruby -e 'require "xcodeproj"; p = Xcodeproj::Project.open("ios/App/App.xcodeproj"); t = p.targets.find { |x| x.name == "App" }; g = p.main_group["App"]; %w[DaysAlarmPlugin.swift DaysViewController.swift].each { |f| t.add_file_references([g.new_reference(f)]) unless g.files.any? { |r| r.path == f } }; t.build_configurations.each { |c| c.build_settings["OTHER_LDFLAGS"] = [c.build_settings["OTHER_LDFLAGS"] || "$(inherited)"].flatten + ["-weak_framework", "AlarmKit"] }; p.save'
          grep -c 'DaysAlarmPlugin.swift' ios/App/App.xcodeproj/project.pbxproj
          perl -pi -e 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="DaysViewController" customModule="App" customModuleProvider="target"/' ios/App/App/Base.lproj/Main.storyboard
          grep -c 'DaysViewController' ios/App/App/Base.lproj/Main.storyboard
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSAlarmKitUsageDescription" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSAlarmKitUsageDescription string 21 Days stellt deinen Wecker für die Gewohnheit Früh aufstehen. Er klingelt auch im Lautlos-Modus." "$P"

      - name: Xcode wählen
        run: |
          ls -d /Applications/Xcode*.app || true
          newest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version

      - name: App bauen (ohne Signatur)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/21Days.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/21Days.xcarchive/Products/Applications/App.app" Payload/
          # Ad-hoc-Signatur nur, damit die HealthKit-Berechtigung in der App steht (Sideloadly signiert danach mit deiner Apple-ID neu).
          codesign --force --deep --sign - --entitlements "$RUNNER_TEMP/App.entitlements" Payload/App.app || echo "Ad-hoc-Signatur übersprungen"
          zip -qry 21Days.ipa Payload
          ls -lh 21Days.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: 21Days-ipa
          path: 21Days.ipa
          retention-days: 14
